name: Finalize placement session fix v2

on:
  push:
    branches:
      - fix/placement-session-independent-drafts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/placement-session-independent-drafts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: python scripts/apply-placement-session-review.py
      - run: npm run check
      - name: Guard final semantics
        run: |
          ! grep -q "canonicalRockPoseRef.current = rockPose" src/features/pedestal/Pedestal.tsx
          grep -q "if (!settlementPlan.rock)" src/features/pedestal/Pedestal.tsx
          grep -q "dirtyAccessories.map" src/features/pedestal/Pedestal.tsx
      - name: Commit product review fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/pedestal/Pedestal.tsx
          git commit -m "fix(placement): préserver le canonique et cibler la persistance"
          git push origin HEAD:fix/placement-session-independent-drafts
