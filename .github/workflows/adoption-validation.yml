name: Validate adoption first path

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/app/**'
      - 'src/features/adoption/**'
      - 'src/features/auth/AuthenticatedHome.tsx'
      - 'src/features/auth/useAuthSession.ts'
      - 'src/features/pedestal/**'
      - 'src/features/showroom/**'
      - 'src/scene/**'
      - 'src/content/rockCatalog*'
      - 'src/styles/adoption.css'
      - 'scripts/web/adoption-e2e-validation.*'
      - 'scripts/web/validate-adoption-e2e.mjs'
      - '.github/workflows/adoption-validation.yml'

permissions:
  contents: read

concurrency:
  group: adoption-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first-path:
    name: Showroom → naming → Socle
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Chrome validation driver
        run: npm install --legacy-peer-deps --no-save --package-lock=false --no-audit --no-fund puppeteer-core@24.16.0

      - name: Validate first post-auth path and retry idempotency key
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- vite --host 127.0.0.1 --port 4175 > /tmp/caillou-adoption-vite.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 3
          google-chrome --version
          node scripts/web/validate-adoption-e2e.mjs

      - name: Upload adoption diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: caillou-adoption-validation-${{ github.run_id }}
          path: build/adoption-validation/
          if-no-files-found: warn
          retention-days: 14
