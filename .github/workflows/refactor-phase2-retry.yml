name: Retry refactor phase 2

on:
  push:
    branches:
      - refactor/harmonisation-sol-placement
    paths:
      - .github/workflows/refactor-phase2-retry.yml

permissions:
  contents: write

jobs:
  fix-and-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/harmonisation-sol-placement
      - name: Align helper install with repository CI
        run: |
          sed -i '/^[[:space:]]*cache: npm$/d' .github/workflows/refactor-phase2-patch.yml
          sed -i 's/npm ci/npm install --no-audit --no-fund/' .github/workflows/refactor-phase2-patch.yml
          git diff --check
      - name: Commit retry and remove this helper
        run: |
          rm .github/workflows/refactor-phase2-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(refactor): aligner le runner de phase 2 avec la CI"
          git push origin HEAD:refactor/harmonisation-sol-placement
