name: Validate cleaning and cosmetic dust

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/app/**'
      - 'src/features/auth/**'
      - 'src/features/caress/**'
      - 'src/features/cleaning/**'
      - 'src/features/pedestal/**'
      - 'src/scene/**'
      - 'src/styles/cleaning.css'
      - 'scripts/web/cleaning-e2e-validation.*'
      - 'scripts/web/validate-cleaning-e2e.mjs'
      - '.github/workflows/cleaning-validation.yml'

permissions:
  contents: read

concurrency:
  group: cleaning-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleaning:
    name: UV dust + idempotent cleaning
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chrome validation driver
        run: npm install --no-save --package-lock=false --no-audit --no-fund puppeteer-core@24.16.0

      - name: Validate cosmetic dust and cleaning persistence
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- vite --host 127.0.0.1 --port 4177 > /tmp/caillou-cleaning-vite.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 3
          google-chrome --version
          node scripts/web/validate-cleaning-e2e.mjs

      - name: Upload cleaning diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: caillou-cleaning-validation-${{ github.run_id }}
          path: build/cleaning-validation/
          if-no-files-found: warn
          retention-days: 14
