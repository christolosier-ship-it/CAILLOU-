name: Fix phase 2 legacy rock constraint

on:
  push:
    branches:
      - refactor/harmonisation-sol-placement
    paths:
      - .github/workflows/refactor-phase2-legacy-rock-constraint.yml

permissions:
  contents: write

jobs:
  fix-phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/harmonisation-sol-placement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Constrain legacy rock gestures synchronously
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/scene/ShowroomScene.tsx')
          text = path.read_text()
          controller_start = text.index('function RockGestureController({')
          controller_end = text.index('\nfunction ManipulationController({', controller_start)
          controller = text[controller_start:controller_end]

          marker = "  pose,\n  onPoseChange,\n}: {"
          if marker not in controller:
              raise SystemExit('RockGestureController signature marker missing')
          controller = controller.replace(marker, "  pose,\n  geometry,\n  onPoseChange,\n}: {", 1)

          marker = "  pose: RockPose\n  onPoseChange: (pose: RockPose) => void"
          if marker not in controller:
              raise SystemExit('RockGestureController props marker missing')
          controller = controller.replace(marker, "  pose: RockPose\n  geometry: PlacementGeometry | null\n  onPoseChange: (pose: RockPose) => void", 1)

          publish_start = controller.index('    const publish = (next: RockPose) => {')
          publish_end = controller.index('    const resetBaseline = () => {', publish_start)
          constrained_publish = """    const publish = (next: RockPose) => {
            const normalized = normalizeRockPose(next)
            if (!geometry) return
            const constrained = normalizeRockPose({
              position: constrainPlacementPosition(
                normalized.position,
                normalized.rotation,
                1,
                geometry,
              ),
              rotation: normalized.rotation,
            })
            poseRef.current = constrained
            onPoseChange(constrained)
            invalidate()
          }

          """
          controller = controller[:publish_start] + constrained_publish + controller[publish_end:]

          deps = '  }, [camera, gl, invalidate, mode, onPoseChange])'
          if deps not in controller:
              raise SystemExit('RockGestureController deps marker missing')
          controller = controller.replace(deps, '  }, [camera, geometry, gl, invalidate, mode, onPoseChange])', 1)
          text = text[:controller_start] + controller + text[controller_end:]

          call_marker = "                pose={rockPose}\n                onPoseChange={onRockPoseDraft}"
          if call_marker not in text:
              raise SystemExit('RockGestureController call marker missing')
          text = text.replace(
              call_marker,
              "                pose={rockPose}\n                geometry={rockGeometry}\n                onPoseChange={onRockPoseDraft}",
              1,
          )

          path.write_text(text)
      - name: Validate phase 2 correction
        run: |
          npm run check
          git diff --check
      - name: Commit product correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene/ShowroomScene.tsx
          git commit -m "fix(placement): contraindre les gestes legacy au Socle"
          git push origin HEAD:refactor/harmonisation-sol-placement
