name: Fix phase 2 legacy rock constraint

on:
  push:
    branches:
      - refactor/harmonisation-sol-placement
    paths:
      - .github/workflows/refactor-phase2-legacy-rock-constraint.yml

permissions:
  contents: write

jobs:
  fix-phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/harmonisation-sol-placement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Constrain legacy rock gestures synchronously
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/scene/ShowroomScene.tsx')
          text = path.read_text()

          old_signature = """function RockGestureController({
            mode,
            pose,
            onPoseChange,
          }: {
            mode: 'rock-position' | 'rock-orientation'
            pose: RockPose
            onPoseChange: (pose: RockPose) => void
          }) {
          """
          new_signature = """function RockGestureController({
            mode,
            pose,
            geometry,
            onPoseChange,
          }: {
            mode: 'rock-position' | 'rock-orientation'
            pose: RockPose
            geometry: PlacementGeometry | null
            onPoseChange: (pose: RockPose) => void
          }) {
          """
          if old_signature not in text:
              raise SystemExit('RockGestureController signature anchor missing')
          text = text.replace(old_signature, new_signature, 1)

          old_publish = """    const publish = (next: RockPose) => {
              const normalized = normalizeRockPose(next)
              poseRef.current = normalized
              onPoseChange(normalized)
              invalidate()
            }
          """
          new_publish = """    const publish = (next: RockPose) => {
              const normalized = normalizeRockPose(next)
              if (!geometry) return
              const constrained = normalizeRockPose({
                position: constrainPlacementPosition(
                  normalized.position,
                  normalized.rotation,
                  1,
                  geometry,
                ),
                rotation: normalized.rotation,
              })
              poseRef.current = constrained
              onPoseChange(constrained)
              invalidate()
            }
          """
          if old_publish not in text:
              raise SystemExit('RockGestureController publish anchor missing')
          text = text.replace(old_publish, new_publish, 1)

          old_deps = "  }, [camera, gl, invalidate, mode, onPoseChange])"
          new_deps = "  }, [camera, geometry, gl, invalidate, mode, onPoseChange])"
          if old_deps not in text:
              raise SystemExit('RockGestureController deps anchor missing')
          text = text.replace(old_deps, new_deps, 1)

          old_call = """              <RockGestureController
                mode={interactionMode}
                pose={rockPose}
                onPoseChange={onRockPoseDraft}
              />
          """
          new_call = """              <RockGestureController
                mode={interactionMode}
                pose={rockPose}
                geometry={rockGeometry}
                onPoseChange={onRockPoseDraft}
              />
          """
          if old_call not in text:
              raise SystemExit('RockGestureController call anchor missing')
          text = text.replace(old_call, new_call, 1)

          path.write_text(text)
      - name: Validate phase 2 correction
        run: |
          npm run check
          git diff --check
      - name: Commit product correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene/ShowroomScene.tsx
          git commit -m "fix(placement): contraindre les gestes legacy au Socle"
          git push origin HEAD:refactor/harmonisation-sol-placement
