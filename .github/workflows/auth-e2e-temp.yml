name: Auth broker E2E temporary

on:
  push:
    branches:
      - feature/04-auth-pseudo-password

permissions:
  contents: read

jobs:
  auth-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://zibhzhpvtiplbkhioqco.supabase.co
      SUPABASE_KEY: sb_publishable_znIFboPQpTVTSPLcBaO3Dg_3sixP54-
    steps:
      - name: Exercise pseudo auth and RLS
        shell: bash
        run: |
          set -euo pipefail
          username="E2E-$(openssl rand -hex 6)"
          username_b="E2E-$(openssl rand -hex 6)"
          password="Quartz!2026-$(openssl rand -hex 8)"

          post() {
            local endpoint="$1"
            local payload="$2"
            curl --fail-with-body -sS -w '\n%{http_code}' \
              -X POST "$SUPABASE_URL/functions/v1/$endpoint" \
              -H "apikey: $SUPABASE_KEY" \
              -H 'Content-Type: application/json' \
              --data "$payload"
          }

          split_response() {
            status="$(printf '%s' "$1" | tail -n 1)"
            body="$(printf '%s' "$1" | sed '$d')"
          }

          response="$(post auth-register "$(jq -nc --arg u "$username" --arg p "$password" '{username:$u,password:$p}')")"
          split_response "$response"
          test "$status" = '201'
          token_a="$(printf '%s' "$body" | jq -er '.session.access_token')"
          test "$(printf '%s' "$body" | jq -r '.username')" = "$username"

          response="$(post auth-register "$(jq -nc --arg u "$username_b" --arg p "$password" '{username:$u,password:$p}')")"
          split_response "$response"
          test "$status" = '201'

          duplicate="$(printf '%s' "$username" | tr '[:upper:]' '[:lower:]')"
          set +e
          response="$(post auth-register "$(jq -nc --arg u "$duplicate" --arg p "$password" '{username:$u,password:$p}')")"
          rc=$?
          set -e
          test "$rc" -ne 0
          split_response "$response"
          test "$status" = '409'
          test "$(printf '%s' "$body" | jq -r '.code')" = 'username_taken'

          set +e
          response="$(post auth-login "$(jq -nc --arg u "$username" --arg p 'WrongPassword!123' '{username:$u,password:$p}')")"
          rc=$?
          set -e
          test "$rc" -ne 0
          split_response "$response"
          test "$status" = '401'
          test "$(printf '%s' "$body" | jq -r '.code')" = 'invalid_credentials'

          response="$(post auth-login "$(jq -nc --arg u "  $username  " --arg p "$password" '{username:$u,password:$p}')")"
          split_response "$response"
          test "$status" = '200'
          token_a="$(printf '%s' "$body" | jq -er '.session.access_token')"

          own_profiles="$(curl -fsS "$SUPABASE_URL/rest/v1/profiles?select=id,username" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $token_a")"
          test "$(printf '%s' "$own_profiles" | jq 'length')" = '1'
          test "$(printf '%s' "$own_profiles" | jq -r '.[0].username')" = "$username"

          rocks="$(curl -fsS "$SUPABASE_URL/rest/v1/user_rocks?select=id&discarded_at=is.null" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $token_a")"
          test "$(printf '%s' "$rocks" | jq 'length')" = '0'

          anonymous_profiles="$(curl -fsS "$SUPABASE_URL/rest/v1/profiles?select=id" -H "apikey: $SUPABASE_KEY")"
          test "$(printf '%s' "$anonymous_profiles" | jq 'length')" = '0'

          curl -fsS -X POST "$SUPABASE_URL/auth/v1/logout" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $token_a" >/dev/null
