name: Refactor phase 2 geometry

on:
  push:
    branches:
      - refactor/harmonisation-sol-placement
    paths:
      - .github/workflows/refactor-phase2-patch.yml

permissions:
  contents: write

jobs:
  patch-phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/harmonisation-sol-placement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Implement common placement geometry and full pedestal constraints
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          Path('src/features/placement/placementGeometry.ts').write_text(r'''import { Box3, Mesh, Vector3 } from 'three'
          import type { Object3D } from 'three'

          import type { PlacementBounds, PlacementVector3 } from './placementTypes'

          export interface PlacementGeometry {
            supportPoints: PlacementVector3[]
            colliderBounds: PlacementBounds
          }

          const FALLBACK_SUPPORT_POINTS: PlacementVector3[] = [
            [-0.5, -0.5, -0.5],
            [-0.5, -0.5, 0.5],
            [-0.5, 0.5, -0.5],
            [-0.5, 0.5, 0.5],
            [0.5, -0.5, -0.5],
            [0.5, -0.5, 0.5],
            [0.5, 0.5, -0.5],
            [0.5, 0.5, 0.5],
          ]

          const SUPPORT_POINT_PRECISION = 100_000

          function tuple(point: Vector3): PlacementVector3 {
            return [point.x, point.y, point.z]
          }

          function pointKey(point: Vector3) {
            return [point.x, point.y, point.z]
              .map((value) => Math.round(value * SUPPORT_POINT_PRECISION))
              .join('|')
          }

          function geometryFromPoints(points: PlacementVector3[]): PlacementGeometry {
            const bounds = new Box3()
            for (const point of points) bounds.expandByPoint(new Vector3(...point))
            return {
              supportPoints: points,
              colliderBounds: {
                min: [bounds.min.x, bounds.min.y, bounds.min.z],
                max: [bounds.max.x, bounds.max.y, bounds.max.z],
              },
            }
          }

          export function createPlacementGeometry(root: Object3D): PlacementGeometry {
            root.updateWorldMatrix(true, true)
            const inverseRoot = root.matrixWorld.clone().invert()
            const supportPoints: PlacementVector3[] = []
            const seen = new Set<string>()
            const point = new Vector3()

            root.traverse((child) => {
              if (!(child instanceof Mesh)) return
              const position = child.geometry.getAttribute('position')
              if (!position) return

              for (let index = 0; index < position.count; index += 1) {
                point.fromBufferAttribute(position, index)
                  .applyMatrix4(child.matrixWorld)
                  .applyMatrix4(inverseRoot)
                if (![point.x, point.y, point.z].every(Number.isFinite)) continue
                const key = pointKey(point)
                if (seen.has(key)) continue
                seen.add(key)
                supportPoints.push(tuple(point))
              }
            })

            return geometryFromPoints(supportPoints.length > 0 ? supportPoints : FALLBACK_SUPPORT_POINTS.map((value) => [...value]))
          }
          ''').write_text if False else None
