              setObject(nextObject)
            }, [])
            const handleRockGeometryReady = useCallback((geometry: PlacementGeometry | null) => {
              setRockGeometry(geometry)
            }, [])
            const handleAccessoryGeometryReady = useCallback((instanceId: string, geometry: PlacementGeometry | null) => {
              setAccessoryGeometries((current) => {
                const next = new Map(current)
                if (geometry) next.set(instanceId, geometry)
                else next.delete(instanceId)
                return next
              })
            }, [])
          """
          text = text.replace(old_handler, new_handler, 1)
          text = text.replace("    const grounded = clampWorldPositionAboveGround(rockPose.position, rockPose.rotation, rockGeometry, PEDESTAL_GROUND_Y)", "    const grounded = constrainPlacementPosition(rockPose.position, rockPose.rotation, 1, rockGeometry)")
          text = text.replace("                onObjectReady={handleObjectReady}\n", "                onObjectReady={handleObjectReady}\n                onPlacementGeometryReady={handleRockGeometryReady}\n")
          text = text.replace("                onGlobalSettled={handleAccessorySettled}\n", "                onGlobalSettled={handleAccessorySettled}\n                onPlacementGeometryReady={handleAccessoryGeometryReady}\n")
          text = text.replace("                accessories={accessories}\n                onRockPoseChange", "                accessories={accessories}\n                accessoryGeometries={accessoryGeometries}\n                onRockPoseChange")
          path.write_text(text)
          PY

      - name: Validate phase 2
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit -- --run
          npm run build
          git diff --check
      - name: Commit phase 2 atomically and remove helper workflow
        run: |
          rm .github/workflows/refactor-phase2-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(placement): introduire la géométrie commune du Socle"
          git push origin HEAD:refactor/harmonisation-sol-placement
