name: Foundation validation (temporary)

on:
  push:
    branches:
      - feature/01-foundation-frontend-pwa

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run foundation checks
        run: npm run check
