name: Execute refactor phase 6 persistence typefix

on:
  push:
    branches:
      - refactor/harmonisation-sol-placement
    paths:
      - .github/workflows/refactor-phase6-persistence-typefix.yml

permissions:
  contents: write

jobs:
  phase6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/harmonisation-sol-placement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply typed phase 6 persistence boundary
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/refactor-phase6-persistence-retry.yml').read_text()
          start = workflow.index('      - name: Apply robust phase 6 persistence boundary')
          end = workflow.index('      - name: Validate phase 6', start)
          section = workflow[start:end]
          wrapper = section.split('        run: |\n', 1)[1]
          wrapper = '\n'.join(line[10:] if line.startswith('          ') else line for line in wrapper.splitlines())

          exec_line = "exec(compile(script, 'phase6-transform.py', 'exec'))"
          patch = '''script = script.replace(
              "onSettledWorld?: (instanceId: string, transform: PlacementTransform) => void",
              "onSettledWorld?: ((instanceId: string, transform: PlacementTransform) => void) | undefined",
              1,
          )
          script = script.replace(
              "? { ...instance, ...result, physicsSettled: undefined }",
              "? { ...instance, ...result }",
              1,
          )
          exec(compile(script, 'phase6-transform.py', 'exec'))'''
          if exec_line not in wrapper:
              raise SystemExit('typefix exec anchor missing')
          wrapper = wrapper.replace(exec_line, patch, 1)
          exec(compile(wrapper, 'phase6-wrapper.py', 'exec'))
      - name: Validate phase 6
        run: |
          npm run check
          git diff --check
          grep -q "persistAccessoryWorldTransform" src/features/pedestal/Pedestal.tsx
          grep -q "persistRockCompositionWorld" src/features/pedestal/Pedestal.tsx
          grep -q "accessory-settle" src/features/pedestal/Pedestal.tsx src/scene/ShowroomScene.tsx
          ! grep -q "accessoryWorldToLocal" src/scene/ShowroomScene.tsx src/scene/AccessoryModel.tsx
          ! grep -q "onAccessoryTransformCommit" src/features/pedestal/Pedestal.tsx src/scene/ShowroomScene.tsx
          test -f supabase/migrations/20260902131355_harmonize_placement_defensive_envelope.sql
          test -f supabase/migrations/20260902132152_remove_legacy_accessory_update_rpc.sql
      - name: Commit phase 6 product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts/web supabase/migrations/20260902131355_harmonize_placement_defensive_envelope.sql supabase/migrations/20260902132152_remove_legacy_accessory_update_rpc.sql
          git commit -m "refactor(placement): isoler la persistance des poses monde"
          git push origin HEAD:refactor/harmonisation-sol-placement
