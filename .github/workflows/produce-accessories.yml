name: Produce CAILLOU accessories

on:
  workflow_dispatch:
  push:
    branches:
      - feature/10a-accessory-catalogue
      - feature/10b-accessory-shop
    paths:
      - 'Ressource/**'
      - 'scripts/blender/accessory_sources.json'
      - 'scripts/blender/export_accessories.py'
      - 'scripts/web/rock-render-validation.html'
      - 'scripts/web/validate-accessory-render.mjs'
      - '.github/workflows/produce-accessories.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Ressource/**'
      - 'scripts/blender/accessory_sources.json'
      - 'scripts/blender/export_accessories.py'
      - 'scripts/web/rock-render-validation.html'
      - 'scripts/web/validate-accessory-render.mjs'
      - '.github/workflows/produce-accessories.yml'
      - 'public/assets/accessories/**'
      - 'public/assets/accessory-previews/**'

permissions:
  contents: write

concurrency:
  group: produce-accessories-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_VERSION: '4.5.13'
  BLENDER_SERIES: '4.5'

jobs:
  produce:
    name: Reproduce and WebGL-validate accessory catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install headless rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libglx-mesa0 unrar

      - name: Install verified Blender 4.5.13 LTS archive
        shell: bash
        run: |
          set -euo pipefail
          base="https://download.blender.org/release/Blender${BLENDER_SERIES}"
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          checksum="blender-${BLENDER_VERSION}.sha256"
          curl --fail --location --retry 3 --output "$archive" "$base/$archive"
          curl --fail --location --retry 3 --output "$checksum" "$base/$checksum"
          grep " $archive$" "$checksum" | sha256sum --check --strict
          tar -xf "$archive"
          echo "$PWD/blender-${BLENDER_VERSION}-linux-x64" >> "$GITHUB_PATH"

      - name: Reproduce autonomous GLB catalogue and previews
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s '-screen 0 1280x1024x24' \
            blender -b --python scripts/blender/export_accessories.py

      - name: Assert generated catalogue contract is reproducible
        if: ${{ github.event_name == 'pull_request' }}
        run: git diff --exit-code -- public/assets/accessories/catalog.json build/accessory-production/report.json

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend with production accessory assets
        run: npm run build

      - name: Install Chrome validation driver
        run: npm install --no-save --package-lock=false --no-audit --no-fund puppeteer-core@24.16.0

      - name: Validate every published accessory in Three.js/WebGL
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/caillou-accessory-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          mapfile -t ids < <(python3 -c "import json; print(*[a['id'] for a in json.load(open('public/assets/accessories/catalog.json'))['accessories']], sep='\\n')")
          node scripts/web/validate-accessory-render.mjs "${ids[@]}"

      - name: Upload production diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: caillou-accessory-production
          path: |
            build/accessory-production/
            public/assets/accessories/
            public/assets/accessory-previews/
          if-no-files-found: error
          retention-days: 30

      - name: Publish validated outputs on the production branch
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build/accessory-production/report.json \
            public/assets/accessories \
            public/assets/accessory-previews
          if git diff --cached --quiet; then
            echo 'Accessory production outputs are already published.'
            exit 0
          fi
          git commit -m 'build(3d): publish validated accessory catalogue'
          git push origin HEAD:"$GITHUB_REF_NAME"
