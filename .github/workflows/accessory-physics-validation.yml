name: Validate accessory physics and stabilization

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'src/features/accessories/**'
      - 'src/scene/**'
      - 'public/assets/accessories/catalog.json'
      - 'scripts/web/accessory-physics-e2e-validation.*'
      - 'scripts/web/validate-accessory-physics-e2e.mjs'
      - '.github/workflows/accessory-physics-validation.yml'

permissions:
  contents: read

concurrency:
  group: accessory-physics-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physics:
    name: Rapier gravity + collisions + phone/tablet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chrome validation driver
        run: npm install --no-save --package-lock=false --no-audit --no-fund puppeteer-core@24.16.0

      - name: Validate accessory physics
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- vite --host 127.0.0.1 --port 4178 > /tmp/caillou-accessory-physics-vite.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 3
          google-chrome --version
          node scripts/web/validate-accessory-physics-e2e.mjs

      - name: Upload physics diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: caillou-accessory-physics-${{ github.run_id }}
          path: build/accessory-physics-validation/
          if-no-files-found: warn
          retention-days: 14
