name: Apply placement session fix

on:
  push:
    branches:
      - fix/placement-session-independent-drafts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/placement-session-independent-drafts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply PlacementSession integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} anchor missing')
              return text.replace(old, new, 1)

          # --- ShowroomScene ---
          path = Path('src/scene/ShowroomScene.tsx')
          text = path.read_text()
          text = replace_once(text,
          "import type { SettledWorldComposition } from '../features/placement/placementPersistence'\n",
          "import type { SettledWorldComposition } from '../features/placement/placementPersistence'\nimport type { PlacementSessionState, PlacementSettlementPlan } from '../features/placement/placementSession'\n",
          'showroom session import')
          text = text.replace('  accessoryLocalToWorld,\n', '')
          text = replace_once(text,
          "  placementTool?: PlacementTool\n",
          "  placementTool?: PlacementTool\n  placementSession?: PlacementSessionState | null\n  settlementPlan?: PlacementSettlementPlan | null\n",
          'showroom props')
          text = replace_once(text,
          "  placementTool = 'position',\n",
          "  placementTool = 'position',\n  placementSession = null,\n  settlementPlan = null,\n",
          'showroom destructure')
          text = text.replace("  const [activePlacementDraft, setActivePlacementDraft] = useState<{ key: string; transform: PlacementTransform } | null>(null)\n", '')
          old_flags = """  const settlingMode = interactionMode === 'settling'\n  const accessorySettling = settlingMode && placementTarget?.kind === 'accessory'\n  const placementRockTarget = placementMode && placementTarget?.kind === 'rock'\n  const globalSettling = settlingMode && placementTarget?.kind === 'rock'\n  const orbitMode = interactionMode === 'orbit'\n"""
          new_flags = """  const settlingMode = interactionMode === 'settling'\n  const placementRockTarget = placementMode && placementTarget?.kind === 'rock'\n  const globalSettling = settlingMode && settlementPlan?.rock === true\n  const orbitMode = interactionMode === 'orbit'\n  const sessionRockTransform = placementSession?.rock ?? {\n    position: [...rockPose.position],\n    rotation: [...rockPose.rotation],\n    scale: 1,\n  }\n"""
          text = replace_once(text, old_flags, new_flags, 'showroom flags')
          text = text.replace("    if (!rockGeometry || globalSettling || placementRockTarget || !onRockPoseDraft) return\n", "    if (!rockGeometry || placementMode || settlingMode || globalSettling || placementRockTarget || !onRockPoseDraft) return\n", 1)
          text = text.replace("  }, [globalSettling, onRockPoseDraft, placementRockTarget, rockGeometry, rockPose])\n", "  }, [globalSettling, onRockPoseDraft, placementMode, placementRockTarget, rockGeometry, rockPose, settlingMode])\n", 1)

          old_settle_effect = """  useEffect(() => {\n    if (!globalSettling) return\n    finalRockRef.current = null\n    finalAccessoriesRef.current = new Map()\n    compositionReportedRef.current = false\n  }, [globalSettling])\n"""
          new_settle_effect = """  useEffect(() => {\n    if (!settlingMode || !settlementPlan || !placementSession) return\n    finalRockRef.current = settlementPlan.rock\n      ? null\n      : { position: [...placementSession.rock.position], rotation: [...placementSession.rock.rotation] }\n    finalAccessoriesRef.current = new Map()\n    for (const instance of accessories) {\n      if (settlementPlan.accessoryIds.includes(instance.id)) continue\n      const transform = placementSession.accessories[instance.id]\n      if (!transform) continue\n      finalAccessoriesRef.current.set(instance.id, {\n        instanceId: instance.id,\n        worldPosition: [...transform.position],\n        worldRotation: [...transform.rotation],\n        uniformScale: transform.scale,\n      })\n    }\n    compositionReportedRef.current = false\n  }, [accessories, placementSession, settlementPlan, settlingMode])\n"""
          text = replace_once(text, old_settle_effect, new_settle_effect, 'showroom settling effect')
          text = text.replace("  if (!globalSettling || !finalRock || compositionReportedRef.current) return\n", "  if (!settlingMode || !settlementPlan || !finalRock || compositionReportedRef.current) return\n", 1)
          text = text.replace("}, [accessories, globalSettling, onCompositionSettled])\n", "}, [accessories, onCompositionSettled, settlementPlan, settlingMode])\n", 1)

          pattern = re.compile(r"\n  const placementDraftKey = .*?\n  return \(\n", re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('showroom draft block anchor missing')
          replacement = r'''\n  const placementDraftKey = placementMode && placementTarget\n    ? placementTarget.kind === 'rock' ? 'rock' : `accessory:${placementTarget.instanceId}`\n    : null\n\n  const activePlacementTransform = useMemo(() => {\n    if (!placementMode || !placementTarget || !placementSession) return null\n    return placementTarget.kind === 'rock'\n      ? placementSession.rock\n      : placementSession.accessories[placementTarget.instanceId] ?? null\n  }, [placementMode, placementSession, placementTarget])\n\n  const placementGeometry = useMemo(() => {\n    if (!placementTarget) return null\n    return placementTarget.kind === 'rock'\n      ? rockGeometry\n      : accessoryGeometries.get(placementTarget.instanceId) ?? null\n  }, [accessoryGeometries, placementTarget, rockGeometry])\n\n  const placementScaleLimits = useMemo<PlacementScaleLimits>(() => {\n    if (!placementTarget || placementTarget.kind === 'rock') return ROCK_PLACEMENT_SCALE_LIMITS\n    const instance = accessories.find((candidate) => candidate.id === placementTarget.instanceId)\n    return instance ? { min: instance.scaleMin, max: instance.scaleMax } : { min: 1, max: 1 }\n  }, [accessories, placementTarget])\n\n  const handlePlacementTransformDraft = useCallback((transform: PlacementTransform) => {\n    if (!placementTarget || !placementDraftKey) return\n    if (placementTarget.kind === 'rock') {\n      onRockPoseDraft?.({ position: [...transform.position], rotation: [...transform.rotation] })\n    } else {\n      onAccessoryPlacementDraft?.(placementTarget.instanceId, transform)\n    }\n  }, [onAccessoryPlacementDraft, onRockPoseDraft, placementDraftKey, placementTarget])\n\n  const handlePlacementTransformEnd = useCallback((transform: PlacementTransform) => {\n    if (!placementTarget || placementTarget.kind !== 'accessory') return\n    onAccessoryPlacementDraft?.(placementTarget.instanceId, transform)\n  }, [onAccessoryPlacementDraft, placementTarget])\n\n  const handleAccessoryModelSettled = useCallback((instanceId: string, transform: PlacementTransform) => {\n    if (settlingMode && settlementPlan) {\n      handleAccessorySettled({\n        instanceId,\n        worldPosition: [...transform.position],\n        worldRotation: [...transform.rotation],\n        uniformScale: transform.scale,\n      })\n      return\n    }\n    onAccessorySettled?.(instanceId, transform)\n  }, [handleAccessorySettled, onAccessorySettled, settlementPlan, settlingMode])\n\n  return (\n'''
          text = text[:match.start()] + replacement + text[match.end():]
          text = text.replace('<group ref={setVisualGroup} position={rockPose.position} quaternion={rockPose.rotation}>', '<group ref={setVisualGroup} position={sessionRockTransform.position} quaternion={sessionRockTransform.rotation}>', 1)

          old_rock_body = """                state={globalSettling ? 'settling' : placementRockTarget ? 'editing' : 'fixed'}\n                transform={{\n                  position: [...rockPose.position],\n                  rotation: [...rockPose.rotation],\n                  scale: 1,\n                }}\n"""
          new_rock_body = """                state={globalSettling ? 'settling' : placementRockTarget ? 'editing' : 'fixed'}\n                transform={sessionRockTransform}\n"""
          text = replace_once(text, old_rock_body, new_rock_body, 'rock body')

          start = text.index('            {accessories.map((instance) => (')
          end = text.index('\n\n\n{placementMode && placementTarget', start)
          accessories_block = '''            {accessories.map((instance) => {\n              const sessionTransform = placementSession?.accessories[instance.id] ?? null\n              const settlesWithRock = settlingMode && settlementPlan?.rock === true\n                && settlementPlan.accessoryIds.includes(instance.id)\n              const settlesIndividually = settlingMode && settlementPlan?.rock === false\n                && settlementPlan.accessoryIds.includes(instance.id)\n              return (\n                <AccessoryModel\n                  key={instance.id}\n                  instance={instance}\n                  selected={selectedAccessoryId === instance.id}\n                  rockPose={rockPose}\n                  compositionFrozen={placementMode || settlingMode}\n                  globalSettling={settlesWithRock}\n                  settlingRequested={settlesIndividually}\n                  onSettledWorld={handleAccessoryModelSettled}\n                  onGlobalSettled={handleAccessorySettled}\n                  placementTransform={sessionTransform}\n                  onPlacementGeometryReady={handleAccessoryGeometryReady}\n                  onLoadStateChange={onAccessoryLoadStateChange}\n                  onDisposed={onAccessoryDisposed}\n                />\n              )\n            })}'''
          text = text[:start] + accessories_block + text[end:]
          old_controller = """{placementMode && placementTarget && activePlacementDraft?.key === placementDraftKey ? (\n  <PlacementController\n    target={placementTarget}\n    tool={placementTool}\n    transform={activePlacementDraft.transform}\n"""
          new_controller = """{placementMode && placementTarget && activePlacementTransform ? (\n  <PlacementController\n    target={placementTarget}\n    tool={placementTool}\n    transform={activePlacementTransform}\n"""
          text = replace_once(text, old_controller, new_controller, 'controller')
          path.write_text(text)

          # --- Pedestal ---
          path = Path('src/features/pedestal/Pedestal.tsx')
          text = path.read_text()
          text = replace_once(text,
          "import type { SettledWorldComposition } from '../placement/placementPersistence'\n",
          "import type { SettledWorldComposition } from '../placement/placementPersistence'\nimport {\n  addPlacementSessionAccessory,\n  buildPlacementSettlementPlan,\n  createPlacementSession,\n  removePlacementSessionAccessory,\n  updatePlacementSession,\n} from '../placement/placementSession'\nimport type { PlacementSessionState, PlacementSettlementPlan } from '../placement/placementSession'\n",
          'pedestal session imports')
          text = replace_once(text,
          "  const [placementTool, setPlacementTool] = useState<PlacementTool>('position')\n",
          "  const [placementTool, setPlacementTool] = useState<PlacementTool>('position')\n  const [placementSession, setPlacementSession] = useState<PlacementSessionState | null>(null)\n  const [settlementPlan, setSettlementPlan] = useState<PlacementSettlementPlan | null>(null)\n",
          'pedestal session state')
          old_flags = """  const settlingMode = mode === 'settling'\n  const accessorySettling = settlingMode && placementTarget?.kind === 'accessory'\n  const globalSettling = settlingMode && placementTarget?.kind === 'rock'\n"""
          new_flags = """  const settlingMode = mode === 'settling'\n  const accessorySettling = settlingMode && settlementPlan !== null && !settlementPlan.rock\n  const globalSettling = settlingMode && settlementPlan?.rock === true\n"""
          text = replace_once(text, old_flags, new_flags, 'pedestal flags')
          text = text.replace("    if (!(placementMode && placementTarget?.kind === 'rock') && !globalSettling) setRockPose(canonical)\n", "    if (!placementMode && !settlingMode) setRockPose(canonical)\n", 1)
          text = text.replace("    globalSettling,\n    placementMode,\n    placementTarget,\n", "    placementMode,\n    settlingMode,\n", 1)

          # Reset session when another top-level mode/shop takes over.
          text = text.replace("    setPlacementTarget(null)\n    setSelectedAccessoryId(null)\n    setRockMovementError(null)\n", "    setPlacementTarget(null)\n    setSelectedAccessoryId(null)\n    setPlacementSession(null)\n    setSettlementPlan(null)\n    setRockPose(canonicalRockPoseRef.current)\n    setRockMovementError(null)\n", 1)
          text = text.replace("  setSelectedAccessoryId(null)\n  setPlacementTarget(null)\n  setMode('orbit')\n", "  setSelectedAccessoryId(null)\n  setPlacementTarget(null)\n  setPlacementSession(null)\n  setSettlementPlan(null)\n  setRockPose(canonicalRockPoseRef.current)\n  setMode('orbit')\n", 1)

          old_add = """    setAccessoryRenderError(null)\n    setSelectedAccessoryId(created.id)\n    setPlacementTarget({ kind: 'accessory', instanceId: created.id })\n    setPlacementTool('position')\n"""
          new_add = """    setAccessoryRenderError(null)\n    setPlacementSession((current) => current ? addPlacementSessionAccessory(current, created) : current)\n    setSelectedAccessoryId(created.id)\n    setPlacementTarget({ kind: 'accessory', instanceId: created.id })\n    setPlacementTool('position')\n"""
          text = replace_once(text, old_add, new_add, 'pedestal add')
          text = text.replace("      setSelectedAccessoryId(null)\n      setPlacementTarget(null)\n      setPlacementTool('position')\n", "      setPlacementSession((current) => current ? removePlacementSessionAccessory(current, instanceId) : current)\n      setSelectedAccessoryId(null)\n      setPlacementTarget(null)\n      setPlacementTool('position')\n", 1)

          pattern = re.compile(r"  const openPlacement = useCallback\(\(\) => \{.*?\n  \}, \[mode, mutationBlocked\]\)\n", re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('openPlacement anchor missing')
          open_placement = '''  const openPlacement = useCallback(() => {\n    if (mutationBlocked) return\n    gestureRef.current = null\n    if (mode === 'cleaning') setDustRevision((revision) => revision + 1)\n    setAccessoryShopOpen(false)\n    setShopFocus('default')\n    setSelectedAccessoryId(null)\n    setPlacementTarget(null)\n    setPlacementTool('position')\n    setRockMovementError(null)\n    setSettlementPlan(null)\n    if (mode === 'placement') {\n      setPlacementSession(null)\n      setRockPose(canonicalRockPoseRef.current)\n      setMode('orbit')\n      return\n    }\n    setPlacementSession(createPlacementSession(rockPose, accessoryInstances))\n    setMode('placement')\n  }, [accessoryInstances, mode, mutationBlocked, rockPose])\n'''
          text = text[:match.start()] + open_placement + text[match.end():]

          marker = """  const handlePlacementTool = useCallback((tool: PlacementTool) => {\n    if (!placementTarget || mutationBlocked) return\n    if (placementTarget.kind === 'rock' && tool === 'size') return\n    setPlacementTool(tool)\n  }, [mutationBlocked, placementTarget])\n\n\n"""
          callbacks = marker + """  const handleRockPlacementDraft = useCallback((pose: RockPose) => {\n    setRockPose(pose)\n    setPlacementSession((current) => current ? updatePlacementSession(current, { kind: 'rock' }, {\n      position: [...pose.position],\n      rotation: [...pose.rotation],\n      scale: 1,\n    }) : current)\n  }, [])\n\n  const handleAccessoryPlacementDraft = useCallback((instanceId: string, transform: PlacementTransform) => {\n    setPlacementSession((current) => current\n      ? updatePlacementSession(current, { kind: 'accessory', instanceId }, transform)\n      : current)\n  }, [])\n\n"""
          text = replace_once(text, marker, callbacks, 'placement draft callbacks')

          old_done = """const handlePlacementDone = useCallback(() => {\n  if (mutationBlocked || mode !== 'placement') return\n  setMode(placementTarget ? 'settling' : 'orbit')\n}, [mode, mutationBlocked, placementTarget])\n"""
          new_done = """const handlePlacementDone = useCallback(() => {\n  if (mutationBlocked || mode !== 'placement') return\n  const plan = buildPlacementSettlementPlan(placementSession)\n  if (!plan) {\n    setPlacementSession(null)\n    setPlacementTarget(null)\n    setSelectedAccessoryId(null)\n    setMode('orbit')\n    return\n  }\n  setSettlementPlan(plan)\n  setMode('settling')\n}, [mode, mutationBlocked, placementSession])\n"""
          text = replace_once(text, old_done, new_done, 'placement done')

          pattern = re.compile(r"const handleAccessorySettled = useCallback\(.*?\n\]\)\n\n  const handlePermitPurchase", re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('accessory settled block missing')
          accessory_settled = '''const handleAccessorySettled = useCallback((instanceId: string, transform: PlacementTransform) => {\n  if (settlingMode || accessoryPersistenceRef.current.has(instanceId)) return\n  if (!accessoryInstances.some((instance) => instance.id === instanceId)) return\n  accessoryPersistenceRef.current.add(instanceId)\n  setAccessoryPersistenceCount(accessoryPersistenceRef.current.size)\n  setAccessoryRenderError(null)\n\n  void persistAccessoryWorldTransform({\n    instanceId,\n    transform,\n    rockPose,\n    eventKey: crypto.randomUUID(),\n  }).then((result) => {\n    acceptStabilizedAccessory(result)\n  }).catch(async (error) => {\n    setAccessoryRenderError(error instanceof Error\n      ? `${error.message} Le dernier état serveur connu a été restauré.`\n      : 'La pose finale n’a pas pu être confirmée ; le dernier état serveur connu a été restauré.')\n    try {\n      await refreshAccessoryPlacements()\n    } catch {\n      // Keep the last visible canonical state if the reread is offline.\n    }\n  }).finally(() => {\n    accessoryPersistenceRef.current.delete(instanceId)\n    setAccessoryPersistenceCount(accessoryPersistenceRef.current.size)\n  })\n}, [\n  acceptStabilizedAccessory,\n  accessoryInstances,\n  refreshAccessoryPlacements,\n  rockPose,\n  settlingMode,\n])\n\n  const handlePermitPurchase'''
          text = text[:match.start()] + accessory_settled + text[match.end():]

          text = text.replace("  if (compositionPending || !globalSettling) return\n", "  if (compositionPending || !settlingMode || !settlementPlan) return\n", 1)
          text = text.replace("    setPlacementTarget(null)\n    setSelectedAccessoryId(null)\n    setPlacementTool('position')\n    setMode('orbit')\n", "    setPlacementSession(null)\n    setSettlementPlan(null)\n    setPlacementTarget(null)\n    setSelectedAccessoryId(null)\n    setPlacementTool('position')\n    setMode('orbit')\n", 1)
          text = text.replace("    setRockPose(canonicalRockPoseRef.current)\n    setPlacementTarget(null)\n", "    setRockPose(canonicalRockPoseRef.current)\n    setPlacementSession(null)\n    setSettlementPlan(null)\n    setPlacementTarget(null)\n", 1)
          text = text.replace("  globalSettling,\n  onServerStateChanged,\n", "  onServerStateChanged,\n  settlementPlan,\n  settlingMode,\n", 1)

          text = text.replace("            onRockPoseDraft={setRockPose}\n", "            onRockPoseDraft={handleRockPlacementDraft}\n", 1)
          text = text.replace("            placementTool={placementTool}\n", "            placementTool={placementTool}\n            placementSession={placementSession}\n            settlementPlan={settlementPlan}\n", 1)
          text = text.replace("            selectedAccessoryId={selectedAccessoryId}\n            onAccessorySettled={handleAccessorySettled}\n", "            selectedAccessoryId={selectedAccessoryId}\n            onAccessoryPlacementDraft={handleAccessoryPlacementDraft}\n            onAccessorySettled={handleAccessorySettled}\n", 1)
          path.write_text(text)
          PY
      - name: Validate
        run: npm run check
      - name: Guard session invariants
        shell: bash
        run: |
          grep -q "placementSession?.accessories\[instance.id\]" src/scene/ShowroomScene.tsx
          grep -q "onAccessoryPlacementDraft={handleAccessoryPlacementDraft}" src/features/pedestal/Pedestal.tsx
          grep -q "buildPlacementSettlementPlan" src/features/pedestal/Pedestal.tsx
          ! grep -q "activePlacementDraft" src/scene/ShowroomScene.tsx
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          if git diff --cached --quiet; then
            echo "No product changes"
            exit 0
          fi
          git commit -m "fix(placement): conserver une composition monde par session"
          git push origin HEAD:fix/placement-session-independent-drafts
