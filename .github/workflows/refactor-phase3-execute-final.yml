name: Execute refactor phase 3 final

on:
  push:
    branches:
      - refactor/harmonisation-sol-placement
    paths:
      - .github/workflows/refactor-phase3-execute-final.yml

permissions:
  contents: write

jobs:
  phase3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/harmonisation-sol-placement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply final phase 3 source transform
        shell: python
        run: |
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/refactor-phase3-execute.yml').read_text()
          start = workflow.index('      - name: Apply universal world transform refactor')
          end = workflow.index('      - name: Validate phase 3', start)
          section = workflow[start:end]
          script = section.split('        run: |\n', 1)[1]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          script = script.replace('callback_anchor = dedent(', 'callback_anchor = (', 1)
          script = script.replace('callback_replacement = callback_anchor + dedent(', 'callback_replacement = callback_anchor + (', 1)
          script = script.replace('old_world = dedent(', 'old_world = (', 1)
          script = script.replace('new_world = dedent(', 'new_world = (', 1)
          exec(compile(script, 'phase3-transform.py', 'exec'))

          showroom = Path('src/scene/ShowroomScene.tsx')
          text = showroom.read_text()
          text, count = re.subn(
              r'\ninterface ManipulationSnapshot \{\n  position: Vector3\n  rotation: Quaternion\n  scale: number\n\}\n',
              '\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('obsolete ManipulationSnapshot not found')
          showroom.write_text(text)
      - name: Validate phase 3
        run: |
          npm run check
          git diff --check
          ! grep -n "onAccessoryTransformChange" src/scene/ShowroomScene.tsx
          ! grep -n "ManipulationSnapshot" src/scene/ShowroomScene.tsx
          grep -n "activePlacementDraft" src/scene/ShowroomScene.tsx
          grep -n "placementTransform" src/scene/AccessoryModel.tsx
      - name: Commit phase 3 product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/placement src/scene/ShowroomScene.tsx src/scene/AccessoryModel.tsx
          git commit -m "refactor(placement): maintenir les drafts en monde"
          git push origin HEAD:refactor/harmonisation-sol-placement
