name: Retry integrate refactor phase 2

on:
  push:
    branches:
      - refactor/harmonisation-sol-placement
    paths:
      - .github/workflows/refactor-phase2-integrate-retry.yml

permissions:
  contents: write

jobs:
  integrate-phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/harmonisation-sol-placement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Re-run phase 2 patch with whitespace-tolerant anchors
        shell: python
        run: |
          from pathlib import Path

          source = Path('.github/workflows/refactor-phase2-integrate.yml').read_text()
          start_marker = '      - name: Wire common placement geometry into rock and accessories\n'
          end_marker = '\n      - name: Validate complete phase 2\n'
          section = source[source.index(start_marker) + len(start_marker):]
          run_marker = '        run: |\n'
          section = section[section.index(run_marker) + len(run_marker):section.index(end_marker)]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in section.splitlines()) + '\n'

          helper_start = script.index('def replace_once(')
          helper_end = script.index('\n\n# RockModel', helper_start)
          robust_helper = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              import re
              if text.count(old) == 1:
                  return text.replace(old, new, 1)
              tokens = [re.escape(token) for token in re.split(r'\\s+', old.strip()) if token]
              pattern = r'\\s+'.join(tokens)
              matches = list(re.finditer(pattern, text, flags=re.MULTILINE))
              if len(matches) != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {len(matches)} after whitespace normalization')
              match = matches[0]
              return text[:match.start()] + new + text[match.end():]
          '''
          script = script[:helper_start] + robust_helper + script[helper_end:]
          exec(compile(script, 'phase2-integration.py', 'exec'), {})
      - name: Validate complete phase 2
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          git diff --check
      - name: Commit product integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene/RockModel.tsx src/scene/AccessoryModel.tsx src/scene/ShowroomScene.tsx
          git commit -m "refactor(placement): brancher la géométrie commune aux objets"
          git push origin HEAD:refactor/harmonisation-sol-placement
