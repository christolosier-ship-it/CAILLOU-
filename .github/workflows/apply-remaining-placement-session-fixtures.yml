name: Apply remaining PlacementSession fixtures

on:
  push:
    branches:
      - fix/placement-session-independent-drafts

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/placement-session-independent-drafts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply remaining fixture migration
        run: python scripts/apply-remaining-placement-session-fixtures.py
      - name: Validate
        run: npm run check
      - name: Commit fixture migration
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/web/rock-movement-e2e-validation.tsx scripts/web/accessory-placement-e2e-validation.tsx; then
            echo "No fixture changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/web/rock-movement-e2e-validation.tsx scripts/web/accessory-placement-e2e-validation.tsx
          git commit -m "test(placement): aligner les fixtures sur PlacementSession"
          git push origin HEAD:fix/placement-session-independent-drafts
