name: Execute refactor phase 7 cleanup retry

on:
  push:
    branches:
      - refactor/harmonisation-sol-placement
    paths:
      - .github/workflows/refactor-phase7-cleanup-retry.yml

permissions:
  contents: write

jobs:
  phase7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/harmonisation-sol-placement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply corrected phase 7 cleanup
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/refactor-phase7-cleanup.yml').read_text()
          start = workflow.index('      - name: Remove legacy placement layers')
          end = workflow.index('      - name: Validate phase 7 cleanup', start)
          section = workflow[start:end]
          script = section.split('        run: |\n', 1)[1]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())

          script = script.replace(
              "export type PlacementQuaternion = [number, number, number, number]\n\nexport interface PlacementTransform",
              "export type PlacementQuaternion = [number, number, number, number]\n\nexport interface PlacementBounds {\n  min: PlacementVector3\n  max: PlacementVector3\n}\n\nexport interface PlacementTransform",
              1,
          )
          marker = "Path('src/features/placement/placementTypes.ts').write_text"
          if marker not in script:
              raise SystemExit('placement types marker missing')
          script = script.replace(
              marker,
              "editor = Path('src/features/accessories/AccessoryEditor.tsx')\nif editor.exists():\n    editor.unlink()\n\n" + marker,
              1,
          )
          exec(compile(script, 'phase7-cleanup.py', 'exec'))
      - name: Validate phase 7 cleanup
        run: |
          npm run check
          git diff --check
          test ! -e src/features/accessories/AccessoryEditor.tsx
          test ! -e src/features/placement/placementRules.ts
          test ! -e src/features/placement/placementRules.test.ts
          ! grep -R "RockGestureController\|legacyRockManipulationMode\|legacyAccessoryMode\|rock-position\|rock-orientation\|clampRockPosition\|clampAccessoryPosition\|clampWorldPositionAboveGround\|commitAccessoryDrafts\|physicsSettled\|updateAccessoryPlacement\|update_equipped_accessory\|ACCESSORY_POSITION_LIMIT\|isAccessoryTransformWithinPhysicsBounds\|ACCESSORY_NUDGE_STEP\|ACCESSORY_ROTATION_STEP" src scripts/web --include='*.ts' --include='*.tsx' --include='*.mjs'
          ! grep -R "accessory-settle\|composition-settle" src scripts/web --include='*.ts' --include='*.tsx' --include='*.mjs'
          grep -q "interactionMode === 'settling'" src/scene/ShowroomScene.tsx
          grep -q "const settlingMode = mode === 'settling'" src/features/pedestal/Pedestal.tsx
          grep -q "from '../features/placement/pedestalFloor'" src/scene/ShowroomScene.tsx
      - name: Commit phase 7 product cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts/web
          git commit -m "refactor(placement): supprimer les couches legacy finales"
          git push origin HEAD:refactor/harmonisation-sol-placement
