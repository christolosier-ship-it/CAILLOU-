name: Validate showroom WebGL and responsive UI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/features/showroom/**'
      - 'src/scene/**'
      - 'src/content/rockCatalog*'
      - 'scripts/web/showroom-memory-validation.html'
      - 'scripts/web/validate-showroom-memory.mjs'
      - 'scripts/web/showroom-ui-validation.html'
      - 'scripts/web/showroom-ui-validation.tsx'
      - 'scripts/web/validate-showroom-ui.mjs'
      - '.github/workflows/showroom-validation.yml'

permissions:
  contents: read

concurrency:
  group: showroom-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  showroom:
    name: WebGL memory + phone/tablet UX
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Install Chrome validation driver
        run: npm install --no-save --package-lock=false --no-audit --no-fund puppeteer-core@24.16.0

      - name: Validate repeated tours and rapid switch in WebGL
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/caillou-showroom-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          google-chrome --version
          node scripts/web/validate-showroom-memory.mjs

      - name: Validate real showroom component on phone and tablet
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- vite --host 127.0.0.1 --port 4174 > /tmp/caillou-showroom-vite.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 3
          node scripts/web/validate-showroom-ui.mjs

      - name: Upload showroom diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: caillou-showroom-validation-${{ github.run_id }}
          path: build/showroom-validation/
          if-no-files-found: warn
          retention-days: 14
