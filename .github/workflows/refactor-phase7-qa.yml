name: Execute refactor phase 7 comparative QA

on:
  push:
    branches:
      - refactor/harmonisation-sol-placement
    paths:
      - .github/workflows/refactor-phase7-qa.yml

permissions:
  contents: write

jobs:
  phase7-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/harmonisation-sol-placement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Strengthen comparative placement QA
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label}: anchor missing')
              return text.replace(old, new, 1)

          # Remove the last historical update-shaped row name from the accessory API.
          api = Path('src/features/accessories/accessoryPlacementApi.ts')
          text = api.read_text()
          old = dedent('''
          interface UpdatePlacementRow {
            instance_id: string
            local_position: unknown
            local_rotation: unknown
            uniform_scale: number
            updated_at: string
          }

          interface StabilizePlacementRow extends UpdatePlacementRow {
            stabilized_at: string
          }
          ''').lstrip()
          new = dedent('''
          interface StabilizePlacementRow {
            instance_id: string
            local_position: unknown
            local_rotation: unknown
            uniform_scale: number
            updated_at: string
            stabilized_at: string
          }
          ''').lstrip()
          text = replace_once(text, old, new, 'accessory API final row type')
          api.write_text(text)

          # The fixture exposes the settled world pose so a fresh Placement session can rehydrate it.
          fixture = Path('scripts/web/placement-unified-e2e-validation.tsx')
          text = fixture.read_text()
          text = replace_once(
              text,
              "  const [selectedWorldDraft, setSelectedWorldDraft] = useState<PlacementTransform | null>(null)\n",
              "  const [selectedWorldDraft, setSelectedWorldDraft] = useState<PlacementTransform | null>(null)\n  const [lastSettledWorld, setLastSettledWorld] = useState<{ instanceId: string; transform: PlacementTransform } | null>(null)\n",
              'fixture settled world state',
          )
          text = replace_once(
              text,
              "const handleIndividualSettled = useCallback((instanceId: string, transform: PlacementTransform) => {\n  const local = worldAccessoryToPersistence(instanceId, transform, pose)\n",
              "const handleIndividualSettled = useCallback((instanceId: string, transform: PlacementTransform) => {\n  setLastSettledWorld({ instanceId, transform })\n  const local = worldAccessoryToPersistence(instanceId, transform, pose)\n",
              'fixture settled world capture',
          )
          text = replace_once(
              text,
              "        data-individual-settled={String(individualSettled)}\n        data-global-settled={String(settled !== null)}\n",
              "        data-individual-settled={String(individualSettled)}\n        data-last-settled-instance={lastSettledWorld?.instanceId ?? ''}\n        data-last-settled-world-position={JSON.stringify(lastSettledWorld?.transform.position ?? null)}\n        data-last-settled-world-rotation={JSON.stringify(lastSettledWorld?.transform.rotation ?? null)}\n        data-last-settled-scale={String(lastSettledWorld?.transform.scale ?? 0)}\n        data-global-settled={String(settled !== null)}\n",
              'fixture settled world output',
          )
          fixture.write_text(text)

          validator = Path('scripts/web/validate-placement-unified-e2e.mjs')
          text = validator.read_text()
          text = replace_once(text, "const GROUND_Y = -0.02\n", "const GROUND_Y = -0.02\nconst PEDESTAL_HALF_SIZE = 2.75\nconst PEDESTAL_EPSILON = 0.006\n", 'pedestal constants')
          text, count = re.subn(
              r"function minimumWorldY\(supportPoints, position, rotation, scale = 1\) \{.*?\n}\n\nfunction assertAboveGround\(label, supportPoints, position, rotation, scale = 1\) \{.*?\n}\n",
              dedent('''
              function worldSupportBounds(supportPoints, position, rotation, scale = 1) {
                const length = Math.hypot(...rotation)
                const [qx, qy, qz, qw] = length > 0.000001 ? rotation.map((value) => value / length) : [0, 0, 0, 1]
                const bounds = {
                  minX: Number.POSITIVE_INFINITY,
                  maxX: Number.NEGATIVE_INFINITY,
                  minY: Number.POSITIVE_INFINITY,
                  minZ: Number.POSITIVE_INFINITY,
                  maxZ: Number.NEGATIVE_INFINITY,
                }
                for (const [sourceX, sourceY, sourceZ] of supportPoints) {
                  const x = sourceX * scale
                  const y = sourceY * scale
                  const z = sourceZ * scale
                  const rotatedX = (1 - 2 * (qy * qy + qz * qz)) * x + 2 * (qx * qy - qz * qw) * y + 2 * (qx * qz + qy * qw) * z
                  const rotatedY = 2 * (qx * qy + qz * qw) * x + (1 - 2 * (qx * qx + qz * qz)) * y + 2 * (qy * qz - qx * qw) * z
                  const rotatedZ = 2 * (qx * qz - qy * qw) * x + 2 * (qy * qz + qx * qw) * y + (1 - 2 * (qx * qx + qy * qy)) * z
                  bounds.minX = Math.min(bounds.minX, position[0] + rotatedX)
                  bounds.maxX = Math.max(bounds.maxX, position[0] + rotatedX)
                  bounds.minY = Math.min(bounds.minY, position[1] + rotatedY)
                  bounds.minZ = Math.min(bounds.minZ, position[2] + rotatedZ)
                  bounds.maxZ = Math.max(bounds.maxZ, position[2] + rotatedZ)
                }
                return bounds
              }

              function assertInsidePedestal(label, supportPoints, position, rotation, scale = 1) {
                if (!Array.isArray(position) || !Array.isArray(rotation)) throw new Error(`${label}: missing world transform`)
                const bounds = worldSupportBounds(supportPoints, position, rotation, scale)
                if (bounds.minY < GROUND_Y - PEDESTAL_EPSILON
                  || bounds.minX < -PEDESTAL_HALF_SIZE - PEDESTAL_EPSILON
                  || bounds.maxX > PEDESTAL_HALF_SIZE + PEDESTAL_EPSILON
                  || bounds.minZ < -PEDESTAL_HALF_SIZE - PEDESTAL_EPSILON
                  || bounds.maxZ > PEDESTAL_HALF_SIZE + PEDESTAL_EPSILON) {
                  throw new Error(`${label}: geometry escaped finite pedestal ${JSON.stringify(bounds)}`)
                }
              }

              function assertVectorClose(label, actual, expected, epsilon = 0.008) {
                if (!Array.isArray(actual) || !Array.isArray(expected) || actual.length !== expected.length) {
                  throw new Error(`${label}: missing comparable vectors`)
                }
                if (actual.some((value, index) => Math.abs(value - expected[index]) > epsilon)) {
                  throw new Error(`${label}: ${JSON.stringify(actual)} != ${JSON.stringify(expected)}`)
                }
              }

              function assertQuaternionEquivalent(label, actual, expected, epsilon = 0.008) {
                if (!Array.isArray(actual) || !Array.isArray(expected) || actual.length !== 4 || expected.length !== 4) {
                  throw new Error(`${label}: missing comparable quaternions`)
                }
                const actualLength = Math.hypot(...actual)
                const expectedLength = Math.hypot(...expected)
                const dot = actual.reduce((sum, value, index) => sum + value / actualLength * expected[index] / expectedLength, 0)
                if (1 - Math.abs(dot) > epsilon) throw new Error(`${label}: quaternion drift ${dot}`)
              }
              ''').rstrip() + '\n',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('world pedestal assertion block missing')
          text = text.replace('assertAboveGround(', 'assertInsidePedestal(')
          text = replace_once(
              text,
              "    individualSettled: Number(element.getAttribute('data-individual-settled') ?? 0),\n    globalSettled: element.getAttribute('data-global-settled') === 'true',\n",
              "    individualSettled: Number(element.getAttribute('data-individual-settled') ?? 0),\n    lastSettledInstance: element.getAttribute('data-last-settled-instance') ?? '',\n    lastSettledWorldPosition: JSON.parse(element.getAttribute('data-last-settled-world-position') ?? 'null'),\n    lastSettledWorldRotation: JSON.parse(element.getAttribute('data-last-settled-world-rotation') ?? 'null'),\n    lastSettledScale: Number(element.getAttribute('data-last-settled-scale') ?? 0),\n    globalSettled: element.getAttribute('data-global-settled') === 'true',\n",
              'validator settled state',
          )
          twist = dedent('''
          async function dispatchTwist(radians = 0.55) {
            await page.$eval('.pedestal-stage canvas', (canvas, angle) => {
              const rect = canvas.getBoundingClientRect()
              const cx = rect.left + rect.width * 0.24
              const cy = rect.top + rect.height * 0.2
              const radius = 34
              const common = { pointerType: 'touch', bubbles: true, cancelable: true, buttons: 1 }
              const start = [
                [cx - radius, cy],
                [cx + radius, cy],
              ]
              const final = [
                [cx - Math.cos(angle) * radius, cy - Math.sin(angle) * radius],
                [cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius],
              ]
              canvas.dispatchEvent(new PointerEvent('pointerdown', { ...common, pointerId: 191, clientX: start[0][0], clientY: start[0][1] }))
              canvas.dispatchEvent(new PointerEvent('pointerdown', { ...common, pointerId: 192, clientX: start[1][0], clientY: start[1][1] }))
              canvas.dispatchEvent(new PointerEvent('pointermove', { ...common, pointerId: 191, clientX: final[0][0], clientY: final[0][1] }))
              canvas.dispatchEvent(new PointerEvent('pointermove', { ...common, pointerId: 192, clientX: final[1][0], clientY: final[1][1] }))
              canvas.dispatchEvent(new PointerEvent('pointerup', { ...common, pointerId: 191, clientX: final[0][0], clientY: final[0][1], buttons: 0 }))
              canvas.dispatchEvent(new PointerEvent('pointerup', { ...common, pointerId: 192, clientX: final[1][0], clientY: final[1][1], buttons: 0 }))
            }, radians)
          }

          ''')
          text = replace_once(text, "try {\n  await page.setCacheEnabled(false)\n", twist + "try {\n  await page.setCacheEnabled(false)\n", 'twist helper')

          rock_boundary = dedent('''
            for (const [dx, dy] of [[900, 0], [-900, 0], [0, 900], [0, -900]]) {
              await dispatchSinglePointer(dx, dy, 0.2, 0.2)
              const boundedRock = await state()
              assertInsidePedestal('rock four-border stress', ROCK_018_SUPPORT_POINTS, boundedRock.rockPosition, boundedRock.rockRotation)
            }

          ''')
          text = replace_once(text, "  for (let index = 0; index < 5; index += 1) await dispatchSinglePointer(0, 540, 0.13, 0.14)\n", rock_boundary + "  for (let index = 0; index < 5; index += 1) await dispatchSinglePointer(0, 540, 0.13, 0.14)\n", 'rock four-border stress')
          rock_twist = dedent('''
            const beforeRockTwist = rockFlooredDuringOrientation.rockRotation
            await dispatchTwist(0.62)
            await page.waitForFunction((before) => {
              const value = JSON.parse(document.querySelector('#placement-unified-e2e-state')?.getAttribute('data-rock-rotation') ?? '[0,0,0,1]')
              return value.some((entry, index) => Math.abs(entry - before[index]) > 0.005)
            }, {}, beforeRockTwist)
            const rockAfterTwist = await state()
            assertInsidePedestal('during rock two-finger twist', ROCK_018_SUPPORT_POINTS, rockAfterTwist.rockPosition, rockAfterTwist.rockRotation)

          ''')
          text = replace_once(
              text,
              "  assertInsidePedestal('during rock orientation', ROCK_018_SUPPORT_POINTS, rockFlooredDuringOrientation.rockPosition, rockFlooredDuringOrientation.rockRotation)\n\n",
              "  assertInsidePedestal('during rock orientation', ROCK_018_SUPPORT_POINTS, rockFlooredDuringOrientation.rockPosition, rockFlooredDuringOrientation.rockRotation)\n\n" + rock_twist,
              'rock two finger twist',
          )
          rehydrate_rock = dedent('''
            const reopenedRock = await state()
            assertVectorClose('rock persisted position rehydration', reopenedRock.rockPosition, rockAfterRapier.globalRockPosition)
            assertQuaternionEquivalent('rock persisted rotation rehydration', reopenedRock.rockRotation, rockAfterRapier.globalRockRotation)
          ''')
          text = replace_once(
              text,
              "  await page.waitForFunction(() => document.querySelector('#placement-unified-e2e-state')?.getAttribute('data-mode') === 'placement')\n  await page.click('.placement-targets > button:nth-child(2)')\n",
              "  await page.waitForFunction(() => document.querySelector('#placement-unified-e2e-state')?.getAttribute('data-mode') === 'placement')\n" + rehydrate_rock + "\n  await page.click('.placement-targets > button:nth-child(2)')\n",
              'rock persistence rehydration',
          )
          accessory_boundary = dedent('''
            for (const [dx, dy] of [[900, 0], [-900, 0], [0, 900], [0, -900]]) {
              await dispatchSinglePointer(dx, dy, 0.18, 0.18)
              const boundedAccessory = await state()
              assertInsidePedestal('accessory four-border stress', MONOCLE_SUPPORT_POINTS, boundedAccessory.selectedWorldPosition, boundedAccessory.selectedWorldRotation, boundedAccessory.selectedScale)
            }

          ''')
          text = replace_once(text, "  for (let index = 0; index < 4; index += 1) await dispatchSinglePointer(0, 520, 0.12, 0.12)\n", accessory_boundary + "  for (let index = 0; index < 4; index += 1) await dispatchSinglePointer(0, 520, 0.12, 0.12)\n", 'accessory four-border stress')
          accessory_twist = dedent('''
            await page.click('.placement-tools button:nth-child(2)')
            const beforeAccessoryTwist = (await state()).selectedWorldRotation
            await dispatchTwist(-0.58)
            await page.waitForFunction((before) => {
              const value = JSON.parse(document.querySelector('#placement-unified-e2e-state')?.getAttribute('data-selected-world-rotation') ?? 'null')
              return Array.isArray(value) && value.some((entry, index) => Math.abs(entry - before[index]) > 0.005)
            }, {}, beforeAccessoryTwist)
            const accessoryAfterTwist = await state()
            assertInsidePedestal('during accessory two-finger twist', MONOCLE_SUPPORT_POINTS, accessoryAfterTwist.selectedWorldPosition, accessoryAfterTwist.selectedWorldRotation, accessoryAfterTwist.selectedScale)

          ''')
          text = replace_once(
              text,
              "  assertInsidePedestal(\n    'during accessory scale',\n    MONOCLE_SUPPORT_POINTS,\n    scaled.selectedWorldPosition,\n    scaled.selectedWorldRotation,\n    scaled.selectedScale,\n  )\n\n",
              "  assertInsidePedestal(\n    'during accessory scale',\n    MONOCLE_SUPPORT_POINTS,\n    scaled.selectedWorldPosition,\n    scaled.selectedWorldRotation,\n    scaled.selectedScale,\n  )\n\n" + accessory_twist,
              'accessory two finger twist',
          )
          accessory_rehydrate = dedent('''
            const settledAccessory = await state()
            if (!settledAccessory.lastSettledInstance || !Array.isArray(settledAccessory.lastSettledWorldPosition) || !Array.isArray(settledAccessory.lastSettledWorldRotation)) {
              throw new Error('accessory final settled world pose was not captured')
            }
            await page.$eval('#reopen-placement', (button) => button.click())
            await page.waitForFunction(() => document.querySelector('#placement-unified-e2e-state')?.getAttribute('data-mode') === 'placement')
            await page.click('.placement-targets > button:last-child')
            await page.waitForFunction((instanceId) => document.querySelector('#placement-unified-e2e-state')?.getAttribute('data-target') === instanceId, {}, settledAccessory.lastSettledInstance)
            const rehydratedAccessory = await state()
            assertVectorClose('accessory persisted position rehydration', rehydratedAccessory.selectedWorldPosition, settledAccessory.lastSettledWorldPosition)
            assertQuaternionEquivalent('accessory persisted rotation rehydration', rehydratedAccessory.selectedWorldRotation, settledAccessory.lastSettledWorldRotation)
            if (Math.abs(rehydratedAccessory.selectedScale - settledAccessory.lastSettledScale) > 0.008) {
              throw new Error(`accessory persisted scale rehydration drift: ${rehydratedAccessory.selectedScale} != ${settledAccessory.lastSettledScale}`)
            }
            assertInsidePedestal('rehydrated accessory pose', MONOCLE_SUPPORT_POINTS, rehydratedAccessory.selectedWorldPosition, rehydratedAccessory.selectedWorldRotation, rehydratedAccessory.selectedScale)

          ''')
          text = replace_once(
              text,
              "  await page.waitForFunction(() => Number(document.querySelector('#placement-unified-e2e-state')?.getAttribute('data-individual-settled') ?? 0) >= 1, { timeout: 12_000 })\n\n  const targetSizes",
              "  await page.waitForFunction(() => Number(document.querySelector('#placement-unified-e2e-state')?.getAttribute('data-individual-settled') ?? 0) >= 1, { timeout: 12_000 })\n\n" + accessory_rehydrate + "  const targetSizes",
              'accessory persistence rehydration',
          )
          text = replace_once(
              text,
              "    sharedCanvasPositionGesture: true,\n    canvasRockOrientation: true,\n    rockHardFloorDuringPlacement: true,\n    rockHardFloorAfterRapier: true,\n    canvasAccessoryPosition: true,\n    accessoryScale: true,\n    accessoryHardFloor: true,\n",
              "    sharedCanvasPositionGesture: true,\n    fourBorderStressRock: true,\n    fourBorderStressAccessory: true,\n    canvasRockOrientation: true,\n    rockTwoFingerTwist: true,\n    rockFinitePedestalDuringPlacement: true,\n    rockFinitePedestalAfterRapier: true,\n    rockPersistenceRehydration: true,\n    canvasAccessoryPosition: true,\n    accessoryTwoFingerPinch: true,\n    accessoryTwoFingerTwist: true,\n    accessoryFinitePedestal: true,\n    accessoryPersistenceRehydration: true,\n",
              'final QA report',
          )
          validator.write_text(text)
      - name: Validate QA source changes
        run: |
          npm run check
          git diff --check
          ! grep -q "interface UpdatePlacementRow" src/features/accessories/accessoryPlacementApi.ts
          grep -q "fourBorderStressRock: true" scripts/web/validate-placement-unified-e2e.mjs
          grep -q "rockTwoFingerTwist: true" scripts/web/validate-placement-unified-e2e.mjs
          grep -q "accessoryTwoFingerTwist: true" scripts/web/validate-placement-unified-e2e.mjs
          grep -q "accessoryPersistenceRehydration: true" scripts/web/validate-placement-unified-e2e.mjs
      - name: Commit comparative QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/accessories/accessoryPlacementApi.ts scripts/web/placement-unified-e2e-validation.tsx scripts/web/validate-placement-unified-e2e.mjs
          git commit -m "test(placement): couvrir frontières gestes et réhydratation"
          git push origin HEAD:refactor/harmonisation-sol-placement
