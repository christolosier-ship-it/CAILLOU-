name: Validate rock movement and global physics

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'src/features/rockMovement/**'
      - 'src/features/pedestal/**'
      - 'src/features/accessories/**'
      - 'src/scene/**'
      - 'src/styles/rock-movement.css'
      - 'scripts/web/rock-movement-e2e-validation.*'
      - 'scripts/web/validate-rock-movement-e2e.mjs'
      - '.github/workflows/rock-movement-validation.yml'

permissions:
  contents: read

concurrency:
  group: rock-movement-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rock-movement:
    name: 6D touch + global gravity + phone/tablet
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Chrome validation driver
        run: npm install --legacy-peer-deps --no-save --package-lock=false --no-audit --no-fund puppeteer-core@24.16.0

      - name: Validate rock movement and global physics
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- vite --host 127.0.0.1 --port 4179 > /tmp/caillou-rock-movement-vite.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 3
          google-chrome --version
          node scripts/web/validate-rock-movement-e2e.mjs

      - name: Upload rock movement diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: caillou-rock-movement-${{ github.run_id }}
          path: build/rock-movement-validation/
          if-no-files-found: warn
          retention-days: 14
