name: Repair phase 3 workflow

on:
  push:
    branches:
      - refactor/harmonisation-sol-placement
    paths:
      - .github/workflows/refactor-phase3-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/harmonisation-sol-placement
      - name: Repair brittle phase 3 anchors
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent, indent

          path = Path('.github/workflows/refactor-phase3-world-transform.yml')
          text = path.read_text()

          def replace_section(source: str, start_marker: str, end_marker: str, body: str) -> str:
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              raw = indent(dedent(body).strip('\n'), '          ') + '\n\n'
              return source[:start] + raw + source[end:]

          text = replace_section(text, '          callback_anchor =', '          callback_replacement =', r'''
          callback_anchor = (
              "  const handleAccessorySettled = useCallback((transform: WorldAccessoryTransform) => {\n"
              "    finalAccessoriesRef.current.set(transform.instanceId, transform)\n"
              "    tryReportComposition()\n"
              "  }, [tryReportComposition])\n\n"
          )
          ''')

          text = replace_section(text, '          accessory_anchor =', '          controller_call_start =', r'''
          accessory_anchor = (
              "                onGlobalSettled={handleAccessorySettled}\n"
              "                onPlacementGeometryReady={handleAccessoryGeometryReady}\n"
          )
          accessory_replacement = (
              "                onGlobalSettled={handleAccessorySettled}\n"
              "                placementTransform={placementMode && placementTarget?.kind === 'accessory' && placementTarget.instanceId === instance.id\n"
              "                  ? activePlacementDraft?.transform ?? null\n"
              "                  : null}\n"
              "                onPlacementGeometryReady={handleAccessoryGeometryReady}\n"
          )
          if accessory_anchor not in text:
              raise SystemExit('AccessoryModel render anchor missing')
          text = text.replace(accessory_anchor, accessory_replacement, 1)
          ''')

          text = replace_section(text, '          world_anchor =', '          world_replacement =', r'''
          world_anchor = (
              "  const worldFromInstance = useCallback(\n"
              "    () => accessoryLocalToWorld(instance.id, instance, rockPose),\n"
              "    [instance, rockPose],\n"
              "  )\n\n"
          )
          ''')

          text = replace_section(text, '          old_sync =', '          new_sync =', r'''
          old_sync = (
              "    const world = worldFromInstance()\n"
              "    const position = { x: world.worldPosition[0], y: world.worldPosition[1], z: world.worldPosition[2] }\n"
              "    const rotation = {\n"
              "      x: world.worldRotation[0],\n"
              "      y: world.worldRotation[1],\n"
              "      z: world.worldRotation[2],\n"
              "      w: world.worldRotation[3],\n"
              "    }\n"
          )
          ''')

          path.write_text(text)
      - name: Commit workflow repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/refactor-phase3-world-transform.yml
          git rm .github/workflows/refactor-phase3-repair.yml
          git commit -m "fix(ci): fiabiliser le workflow phase 3"
          git push origin HEAD:refactor/harmonisation-sol-placement
