name: Validate Bio Stats and discard

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/features/adoption/EmptyRockState.tsx'
      - 'src/features/auth/**'
      - 'src/features/bio/**'
      - 'src/features/discard/**'
      - 'src/features/pedestal/Step11Pedestal.tsx'
      - 'src/features/pedestal/step11ControlRules*'
      - 'src/main.tsx'
      - 'src/styles/step11.css'
      - 'scripts/web/step11-e2e-validation.*'
      - 'scripts/web/validate-step11-e2e.mjs'
      - '.github/workflows/step11-validation.yml'

permissions:
  contents: read

concurrency:
  group: step11-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bio-discard:
    name: Bio / Stats → Jeter → état vide
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Validate lint TypeScript tests and build
        run: npm run check

      - name: Install Chrome validation driver
        run: npm install --legacy-peer-deps --no-save --package-lock=false --no-audit --no-fund puppeteer-core@24.16.0

      - name: Validate Bio and discard on phone and tablet
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- vite --host 127.0.0.1 --port 4175 > /tmp/caillou-step11-vite.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 3
          google-chrome --version
          node scripts/web/validate-step11-e2e.mjs

      - name: Upload Step 11 diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: caillou-step11-validation-${{ github.run_id }}
          path: build/step11-validation/
          if-no-files-found: warn
          retention-days: 14
