name: Execute refactor phase 4 controller fixed

on:
  push:
    branches:
      - refactor/harmonisation-sol-placement
    paths:
      - .github/workflows/refactor-phase4-controller-fixed.yml

permissions:
  contents: write

jobs:
  phase4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/harmonisation-sol-placement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply corrected phase 4 single-controller cleanup
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/refactor-phase4-controller.yml').read_text()
          start = workflow.index('      - name: Apply phase 4 single-controller cleanup')
          end = workflow.index('      - name: Validate phase 4', start)
          section = workflow[start:end]
          script = section.split('        run: |\n', 1)[1]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          script = script.replace('legacy_props = dedent(', 'legacy_props = (', 1)
          script = script.replace('replacement_props = dedent(', 'replacement_props = (', 1)
          exec(compile(script, 'phase4-transform.py', 'exec'))
      - name: Validate phase 4
        run: |
          npm run check
          git diff --check
          grep -n "function PlacementController" src/scene/ShowroomScene.tsx
          ! grep -n "RockGestureController" src/scene/ShowroomScene.tsx
          ! grep -n "ManipulationController" src/scene/ShowroomScene.tsx
          ! grep -nE "rock-position|rock-orientation|legacyAccessoryMode|legacyRockManipulationMode" src/scene/ShowroomScene.tsx
          ! grep -nE "editing: boolean|rockObject\?:|onSelect:|onTransformDraft\?:" src/scene/AccessoryModel.tsx
          grep -n "resolvePlacementGesture" src/scene/ShowroomScene.tsx
      - name: Commit phase 4 product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/placement src/scene/ShowroomScene.tsx src/scene/AccessoryModel.tsx src/features/pedestal/Pedestal.tsx
          git commit -m "refactor(placement): unifier le contrôleur tactile"
          git push origin HEAD:refactor/harmonisation-sol-placement
