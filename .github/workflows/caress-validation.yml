name: Validate caress and Lithon UX

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/app/**'
      - 'src/features/auth/**'
      - 'src/features/caress/**'
      - 'src/features/pedestal/**'
      - 'src/scene/**'
      - 'src/styles/caress.css'
      - 'scripts/web/caress-e2e-validation.*'
      - 'scripts/web/validate-caress-e2e.mjs'
      - '.github/workflows/caress-validation.yml'

permissions:
  contents: read

concurrency:
  group: caress-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  caress:
    name: Surface stroke + idempotent Lithon
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Chrome validation driver
        run: npm install --legacy-peer-deps --no-save --package-lock=false --no-audit --no-fund puppeteer-core@24.16.0

      - name: Validate tactile caress and retry semantics
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- vite --host 127.0.0.1 --port 4176 > /tmp/caillou-caress-vite.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 3
          google-chrome --version
          node scripts/web/validate-caress-e2e.mjs

      - name: Upload caress diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: caillou-caress-validation-${{ github.run_id }}
          path: build/caress-validation/
          if-no-files-found: warn
          retention-days: 14
