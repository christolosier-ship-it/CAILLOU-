name: Update accessory physics PlacementSession E2E

on:
  push:
    branches:
      - fix/placement-session-independent-drafts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-e2e:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/placement-session-independent-drafts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: python scripts/apply-accessory-physics-session-e2e.py
      - run: npm run check
      - name: Commit permanent physics fixture update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/web/accessory-physics-e2e-validation.tsx
          git commit -m "test(placement): aligner la physique accessoire sur PlacementSession"
          git push origin HEAD:fix/placement-session-independent-drafts
