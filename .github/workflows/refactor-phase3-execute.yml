name: Execute refactor phase 3

on:
  push:
    branches:
      - refactor/harmonisation-sol-placement
    paths:
      - .github/workflows/refactor-phase3-execute.yml

permissions:
  contents: write

jobs:
  phase3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/harmonisation-sol-placement
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply universal world transform refactor
        shell: python
        run: |
          from pathlib import Path
          import re
          from textwrap import dedent

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'{label} anchor missing')
              return text.replace(old, new, 1)

          # 1. Universal placement transform type.
          path = Path('src/features/placement/placementTypes.ts')
          text = path.read_text()
          if 'export interface PlacementTransform' not in text:
              text += dedent('''

              export type PlacementQuaternion = [number, number, number, number]

              export interface PlacementTransform {
                position: PlacementVector3
                rotation: PlacementQuaternion
                scale: number
              }
              ''')
          path.write_text(text)

          # 2. Shared transform helpers.
          Path('src/features/placement/placementTransform.ts').write_text(dedent('''
          import { Quaternion } from 'three'

          import type { PlacementTransform } from './placementTypes'

          export interface PlacementScaleLimits {
            min: number
            max: number
          }

          export const ROCK_PLACEMENT_SCALE_LIMITS: PlacementScaleLimits = { min: 1, max: 1 }

          function finite(value: number, fallback: number) {
            return Number.isFinite(value) ? value : fallback
          }

          export function normalizePlacementTransform(
            transform: PlacementTransform,
            limits: PlacementScaleLimits,
          ): PlacementTransform {
            const min = Math.min(limits.min, limits.max)
            const max = Math.max(limits.min, limits.max)
            const quaternion = new Quaternion(
              finite(transform.rotation[0], 0),
              finite(transform.rotation[1], 0),
              finite(transform.rotation[2], 0),
              finite(transform.rotation[3], 1),
            )
            if (quaternion.lengthSq() < 0.000001) quaternion.identity()
            quaternion.normalize()
            const rawScale = finite(transform.scale, min)
            return {
              position: [
                finite(transform.position[0], 0),
                finite(transform.position[1], 0),
                finite(transform.position[2], 0),
              ],
              rotation: [quaternion.x, quaternion.y, quaternion.z, quaternion.w],
              scale: Math.max(min, Math.min(max, rawScale)),
            }
          }

          export function copyPlacementTransform(transform: PlacementTransform): PlacementTransform {
            return {
              position: [...transform.position],
              rotation: [...transform.rotation],
              scale: transform.scale,
            }
          }
          '''))

          # 3. Transform-level pedestal constraint.
          path = Path('src/features/placement/placementConstraints.ts')
          text = path.read_text()
          text = replace_once(
              text,
              "import type { PlacementVector3 } from './placementTypes'",
              "import type { PlacementTransform, PlacementVector3 } from './placementTypes'",
              'placement constraints import',
          )
          if 'export function constrainTransformToPedestal' not in text:
              text += dedent('''

              export function constrainTransformToPedestal(
                transform: PlacementTransform,
                geometry: PlacementGeometry,
              ): PlacementTransform {
                return {
                  ...transform,
                  position: constrainPlacementPosition(
                    transform.position,
                    transform.rotation,
                    transform.scale,
                    geometry,
                  ),
                }
              }
              ''')
          path.write_text(text)

          # 4. Pure tests for the universal representation.
          Path('src/features/placement/placementTransform.test.ts').write_text(dedent('''
          import { describe, expect, it } from 'vitest'

          import { constrainTransformToPedestal } from './placementConstraints'
          import type { PlacementGeometry } from './placementGeometry'
          import {
            ROCK_PLACEMENT_SCALE_LIMITS,
            copyPlacementTransform,
            normalizePlacementTransform,
          } from './placementTransform'

          const geometry: PlacementGeometry = {
            supportPoints: [
              [-0.5, -0.5, -0.5], [0.5, -0.5, -0.5],
              [-0.5, -0.5, 0.5], [0.5, -0.5, 0.5],
              [-0.5, 0.5, -0.5], [0.5, 0.5, -0.5],
              [-0.5, 0.5, 0.5], [0.5, 0.5, 0.5],
            ],
            colliderBounds: { min: [-0.5, -0.5, -0.5], max: [0.5, 0.5, 0.5] },
          }

          describe('PlacementTransform', () => {
            it('keeps rock scale at one and normalizes its quaternion', () => {
              const result = normalizePlacementTransform(
                { position: [1, 2, 3], rotation: [0, 0, 0, 4], scale: 12 },
                ROCK_PLACEMENT_SCALE_LIMITS,
              )
              expect(result).toEqual({ position: [1, 2, 3], rotation: [0, 0, 0, 1], scale: 1 })
            })

            it('clamps accessory scale while preserving its world pose', () => {
              const result = normalizePlacementTransform(
                { position: [1, 2, 3], rotation: [0, 0, 0, 1], scale: 7 },
                { min: 0.5, max: 2 },
              )
              expect(result.position).toEqual([1, 2, 3])
              expect(result.rotation).toEqual([0, 0, 0, 1])
              expect(result.scale).toBe(2)
            })

            it('constrains the complete transform without changing rotation or scale', () => {
              const transform = { position: [9, -2, 9] as [number, number, number], rotation: [0, 0, 0, 1] as [number, number, number, number], scale: 1.5 }
              const result = constrainTransformToPedestal(transform, geometry)
              expect(result.position[0]).toBeLessThan(9)
              expect(result.position[1]).toBeGreaterThan(-2)
              expect(result.position[2]).toBeLessThan(9)
              expect(result.rotation).toEqual(transform.rotation)
              expect(result.scale).toBe(1.5)
            })

            it('copies tuple storage instead of aliasing draft arrays', () => {
              const source = { position: [1, 2, 3] as [number, number, number], rotation: [0, 0, 0, 1] as [number, number, number, number], scale: 1 }
              const copy = copyPlacementTransform(source)
              copy.position[0] = 99
              expect(source.position[0]).toBe(1)
            })
          })
          '''))

          # 5. Showroom uses one world draft during every live gesture.
          path = Path('src/scene/ShowroomScene.tsx')
          text = path.read_text()
          text = replace_once(
              text,
              "import { constrainPlacementPosition } from '../features/placement/placementConstraints'",
              "import { constrainPlacementPosition, constrainTransformToPedestal } from '../features/placement/placementConstraints'",
              'showroom constraint import',
          )
          text = replace_once(
              text,
              "import type { PlacementTarget, PlacementTool } from '../features/placement/placementTypes'",
              "import type { PlacementTarget, PlacementTool, PlacementTransform } from '../features/placement/placementTypes'\nimport { normalizePlacementTransform, ROCK_PLACEMENT_SCALE_LIMITS } from '../features/placement/placementTransform'\nimport type { PlacementScaleLimits } from '../features/placement/placementTransform'",
              'showroom placement imports',
          )

          generic_controller = dedent('''
          function ManipulationController({
            target,
            tool,
            transform,
            geometry,
            scaleLimits,
            onTransformChange,
            onTransformEnd,
          }: {
            target: PlacementTarget
            tool: PlacementTool
            transform: PlacementTransform
            geometry: PlacementGeometry | null
            scaleLimits: PlacementScaleLimits
            onTransformChange: (transform: PlacementTransform) => void
            onTransformEnd: (transform: PlacementTransform) => void
          }) {
            const camera = useThree((state) => state.camera)
            const gl = useThree((state) => state.gl)
            const invalidate = useThree((state) => state.invalidate)
            const pointersRef = useRef(new Map<number, GesturePoint>())
            const previousSingleRef = useRef<GesturePoint | null>(null)
            const baselineRef = useRef<{ distance: number; angle: number; transform: PlacementTransform } | null>(null)
            const transformRef = useRef(transform)
            const stateRef = useRef({ target, tool, geometry, scaleLimits })

            useEffect(() => {
              transformRef.current = transform
            }, [transform])

            useEffect(() => {
              stateRef.current = { target, tool, geometry, scaleLimits }
            }, [geometry, scaleLimits, target, tool])

            useEffect(() => {
              const canvas = gl.domElement
              const points = () => [...pointersRef.current.values()]
              const distance = (items: GesturePoint[]) => Math.hypot(items[1]!.x - items[0]!.x, items[1]!.y - items[0]!.y)
              const angle = (items: GesturePoint[]) => Math.atan2(items[1]!.y - items[0]!.y, items[1]!.x - items[0]!.x)
              const worldPerPixel = () => {
                const position = new Vector3(...transformRef.current.position)
                const cameraDistance = Math.max(0.5, camera.position.distanceTo(position))
                if (!(camera instanceof PerspectiveCamera)) return cameraDistance / Math.max(320, canvas.clientHeight)
                return 2 * cameraDistance * Math.tan(MathUtils.degToRad(camera.fov) / 2) / Math.max(1, canvas.clientHeight)
              }
              const publish = (next: PlacementTransform) => {
                const current = stateRef.current
                let safe = normalizePlacementTransform(next, current.scaleLimits)
                if (current.geometry) safe = constrainTransformToPedestal(safe, current.geometry)
                transformRef.current = safe
                onTransformChange(safe)
                invalidate()
              }
              const resetBaseline = () => {
                const items = points()
                if (items.length >= 2) {
                  baselineRef.current = {
                    distance: Math.max(1, distance(items)),
                    angle: angle(items),
                    transform: {
                      position: [...transformRef.current.position],
                      rotation: [...transformRef.current.rotation],
                      scale: transformRef.current.scale,
                    },
                  }
                  previousSingleRef.current = null
                } else if (items.length === 1) {
                  previousSingleRef.current = items[0] ?? null
                  baselineRef.current = null
                } else {
                  previousSingleRef.current = null
                  baselineRef.current = null
                }
              }
              const onPointerDown = (event: PointerEvent) => {
                event.preventDefault()
                pointersRef.current.set(event.pointerId, { x: event.clientX, y: event.clientY })
                try { canvas.setPointerCapture(event.pointerId) } catch { /* capture is optional */ }
                resetBaseline()
              }
              const onPointerMove = (event: PointerEvent) => {
                if (!pointersRef.current.has(event.pointerId)) return
                event.preventDefault()
                pointersRef.current.set(event.pointerId, { x: event.clientX, y: event.clientY })
                const current = stateRef.current
                const items = points()
                const scalePerPixel = worldPerPixel()

                if (items.length >= 2 && baselineRef.current) {
                  const baseline = baselineRef.current
                  if (current.tool === 'position') {
                    const delta = distance(items) - baseline.distance
                    const view = camera.getWorldDirection(new Vector3()).normalize()
                    const base = new Vector3(...baseline.transform.position).addScaledVector(view, -delta * scalePerPixel * 1.35)
                    publish({ ...baseline.transform, position: [base.x, base.y, base.z] })
                  } else if (current.tool === 'orientation') {
                    const twist = angle(items) - baseline.angle
                    const axis = camera.getWorldDirection(new Vector3()).normalize()
                    const nextRotation = new Quaternion().setFromAxisAngle(axis, twist)
                      .multiply(new Quaternion(...baseline.transform.rotation))
                      .normalize()
                    publish({ ...baseline.transform, rotation: [nextRotation.x, nextRotation.y, nextRotation.z, nextRotation.w] })
                  } else if (current.tool === 'size' && current.target.kind === 'accessory') {
                    const ratio = Math.max(0.2, distance(items) / baseline.distance)
                    publish({ ...baseline.transform, scale: baseline.transform.scale * ratio })
                  }
                  return
                }

                if (items.length !== 1 || current.tool === 'size') return
                const point = items[0]
                if (!point) return
                const previous = previousSingleRef.current
                previousSingleRef.current = point
                if (!previous) return
                const dx = point.x - previous.x
                const dy = point.y - previous.y
                const active = transformRef.current

                if (current.tool === 'position') {
                  const right = new Vector3(1, 0, 0).applyQuaternion(camera.quaternion).normalize()
                  const up = new Vector3(0, 1, 0).applyQuaternion(camera.quaternion).normalize()
                  const next = new Vector3(...active.position)
                    .addScaledVector(right, dx * scalePerPixel)
                    .addScaledVector(up, -dy * scalePerPixel)
                  publish({ ...active, position: [next.x, next.y, next.z] })
                } else {
                  const cameraUp = new Vector3(0, 1, 0).applyQuaternion(camera.quaternion).normalize()
                  const cameraRight = new Vector3(1, 0, 0).applyQuaternion(camera.quaternion).normalize()
                  const yaw = new Quaternion().setFromAxisAngle(cameraUp, dx * 0.008)
                  const pitch = new Quaternion().setFromAxisAngle(cameraRight, dy * 0.008)
                  const next = yaw.multiply(pitch).multiply(new Quaternion(...active.rotation)).normalize()
                  publish({ ...active, rotation: [next.x, next.y, next.z, next.w] })
                }
              }
              const onPointerEnd = (event: PointerEvent) => {
                pointersRef.current.delete(event.pointerId)
                try {
                  if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId)
                } catch { /* nothing to release */ }
                resetBaseline()
                if (pointersRef.current.size === 0) onTransformEnd(transformRef.current)
              }

              canvas.addEventListener('pointerdown', onPointerDown, { passive: false })
              canvas.addEventListener('pointermove', onPointerMove, { passive: false })
              canvas.addEventListener('pointerup', onPointerEnd, { passive: false })
              canvas.addEventListener('pointercancel', onPointerEnd, { passive: false })
              return () => {
                pointersRef.current.clear()
                canvas.removeEventListener('pointerdown', onPointerDown)
                canvas.removeEventListener('pointermove', onPointerMove)
                canvas.removeEventListener('pointerup', onPointerEnd)
                canvas.removeEventListener('pointercancel', onPointerEnd)
              }
            }, [camera, gl, invalidate, onTransformChange, onTransformEnd])

            return null
          }

          ''')
          text, count = re.subn(r'function ManipulationController\(\{.*?\nfunction RockPhysicsBody\(\{', generic_controller + 'function RockPhysicsBody({', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('ManipulationController block not found')

          state_anchor = "  const [visualGroup, setVisualGroup] = useState<Group | null>(null)\n"
          state_insert = state_anchor + "  const [activePlacementDraft, setActivePlacementDraft] = useState<{ key: string; transform: PlacementTransform } | null>(null)\n"
          text = replace_once(text, state_anchor, state_insert, 'placement draft state')

          callback_anchor = dedent('''
            const handleAccessorySettled = useCallback((transform: WorldAccessoryTransform) => {
              finalAccessoriesRef.current.set(transform.instanceId, transform)
              tryReportComposition()
            }, [tryReportComposition])

          ''')
          callback_replacement = callback_anchor + dedent('''
            const placementDraftKey = placementMode && placementTarget
              ? placementTarget.kind === 'rock' ? 'rock' : `accessory:${placementTarget.instanceId}`
              : null

            useEffect(() => {
              if (!placementMode || !placementTarget || !placementDraftKey) {
                setActivePlacementDraft(null)
                return
              }
              setActivePlacementDraft((current) => {
                if (current?.key === placementDraftKey) return current
                if (placementTarget.kind === 'rock') {
                  return {
                    key: placementDraftKey,
                    transform: normalizePlacementTransform({
                      position: [...rockPose.position],
                      rotation: [...rockPose.rotation],
                      scale: 1,
                    }, ROCK_PLACEMENT_SCALE_LIMITS),
                  }
                }
                const instance = accessories.find((candidate) => candidate.id === placementTarget.instanceId)
                if (!instance) return null
                const world = accessoryLocalToWorld(instance.id, instance, rockPose)
                return {
                  key: placementDraftKey,
                  transform: normalizePlacementTransform({
                    position: [...world.worldPosition],
                    rotation: [...world.worldRotation],
                    scale: instance.uniformScale,
                  }, { min: instance.scaleMin, max: instance.scaleMax }),
                }
              })
            }, [accessories, placementDraftKey, placementMode, placementTarget, rockPose])

            const placementGeometry = useMemo(() => {
              if (!placementTarget) return null
              return placementTarget.kind === 'rock'
                ? rockGeometry
                : accessoryGeometries.get(placementTarget.instanceId) ?? null
            }, [accessoryGeometries, placementTarget, rockGeometry])

            const placementScaleLimits = useMemo<PlacementScaleLimits>(() => {
              if (!placementTarget || placementTarget.kind === 'rock') return ROCK_PLACEMENT_SCALE_LIMITS
              const instance = accessories.find((candidate) => candidate.id === placementTarget.instanceId)
              return instance ? { min: instance.scaleMin, max: instance.scaleMax } : { min: 1, max: 1 }
            }, [accessories, placementTarget])

            const handlePlacementTransformDraft = useCallback((transform: PlacementTransform) => {
              if (!placementTarget || !placementDraftKey) return
              setActivePlacementDraft({ key: placementDraftKey, transform })
              if (placementTarget.kind === 'rock') {
                onRockPoseDraft?.({ position: [...transform.position], rotation: [...transform.rotation] })
              }
            }, [onRockPoseDraft, placementDraftKey, placementTarget])

            const handlePlacementTransformEnd = useCallback((transform: PlacementTransform) => {
              if (!placementTarget || placementTarget.kind !== 'accessory') return
              const instance = accessories.find((candidate) => candidate.id === placementTarget.instanceId)
              if (!instance) return
              const local = accessoryWorldToLocal({
                instanceId: instance.id,
                worldPosition: [...transform.position],
                worldRotation: [...transform.rotation],
                uniformScale: transform.scale,
              }, rockPose)
              onAccessoryTransformDraft?.(
                instance.id,
                clampAccessoryTransform(local, instance.scaleMin, instance.scaleMax),
              )
            }, [accessories, onAccessoryTransformDraft, placementTarget, rockPose])

          ''')
          text = replace_once(text, callback_anchor, callback_replacement, 'showroom placement callbacks')

          accessory_anchor = "                onGlobalSettled={handleAccessorySettled}\n                onPlacementGeometryReady={handleAccessoryGeometryReady}\n"
          accessory_replacement = "                onGlobalSettled={handleAccessorySettled}\n                placementTransform={placementMode && placementTarget?.kind === 'accessory' && placementTarget.instanceId === instance.id\n                  ? activePlacementDraft?.transform ?? null\n                  : null}\n                onPlacementGeometryReady={handleAccessoryGeometryReady}\n"
          text = replace_once(text, accessory_anchor, accessory_replacement, 'accessory placement render')

          controller_pattern = re.compile(r'''            \{placementMode && placementTarget \? \(\n              <ManipulationController\n.*?              />\n            \) : null\}''', re.S)
          controller_replacement = dedent('''
                      {placementMode && placementTarget && activePlacementDraft?.key === placementDraftKey ? (
                        <ManipulationController
                          target={placementTarget}
                          tool={placementTool}
                          transform={activePlacementDraft.transform}
                          geometry={placementGeometry}
                          scaleLimits={placementScaleLimits}
                          onTransformChange={handlePlacementTransformDraft}
                          onTransformEnd={handlePlacementTransformEnd}
                        />
                      ) : null}''').rstrip()
          text, count = controller_pattern.subn(controller_replacement, text, count=1)
          if count != 1:
              raise SystemExit('ManipulationController render call not found')
          path.write_text(text)

          # 6. Accessory visual/Rapier body consumes the world draft directly while editing.
          path = Path('src/scene/AccessoryModel.tsx')
          text = path.read_text()
          text = replace_once(
              text,
              "import type { PlacementGeometry } from '../features/placement/placementGeometry'",
              "import type { PlacementGeometry } from '../features/placement/placementGeometry'\nimport type { PlacementTransform } from '../features/placement/placementTypes'",
              'accessory placement transform import',
          )
          prop_anchor = "  onGlobalSettled?: (transform: WorldAccessoryTransform) => void\n"
          text = replace_once(text, prop_anchor, prop_anchor + "  placementTransform?: PlacementTransform | null\n", 'accessory prop')
          destructure_anchor = "  onGlobalSettled,\n  onPlacementGeometryReady,\n"
          text = replace_once(text, destructure_anchor, "  onGlobalSettled,\n  placementTransform = null,\n  onPlacementGeometryReady,\n", 'accessory destructure')

          old_world = dedent('''
            const worldFromInstance = useCallback(
              () => accessoryLocalToWorld(instance.id, instance, rockPose),
              [instance, rockPose],
            )
          ''')
          new_world = dedent('''
            const worldFromInstance = useCallback((): WorldAccessoryTransform => {
              if (placementTransform) {
                return {
                  instanceId: instance.id,
                  worldPosition: [...placementTransform.position],
                  worldRotation: [...placementTransform.rotation],
                  uniformScale: placementTransform.scale,
                }
              }
              return accessoryLocalToWorld(instance.id, instance, rockPose)
            }, [instance, placementTransform, rockPose])
          ''')
          text = replace_once(text, old_world, new_world, 'accessory world source')
          text = replace_once(text, "  const world = accessoryLocalToWorld(instance.id, instance, rockPose)\n  const collider =", "  const world = worldFromInstance()\n  const renderScale = placementTransform?.scale ?? instance.uniformScale\n  const collider =", 'accessory render world')
          text = replace_once(text, "key={`${instance.id}-${instance.uniformScale.toFixed(4)}`}", "key={`${instance.id}-${renderScale.toFixed(4)}`}", 'accessory rigidbody key')
          text = replace_once(text, "      scale={instance.uniformScale}\n", "      scale={renderScale}\n", 'accessory render scale')
          path.write_text(text)

      - name: Validate phase 3
        run: |
          npm run check
          git diff --check
          ! grep -n "onAccessoryTransformChange" src/scene/ShowroomScene.tsx
          grep -n "activePlacementDraft" src/scene/ShowroomScene.tsx
          grep -n "placementTransform" src/scene/AccessoryModel.tsx
      - name: Commit phase 3 product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/placement src/scene/ShowroomScene.tsx src/scene/AccessoryModel.tsx
          git commit -m "refactor(placement): maintenir les drafts en monde"
          git push origin HEAD:refactor/harmonisation-sol-placement
