name: Execute refactor phase 5 placement body final 3

on:
  push:
    branches:
      - refactor/harmonisation-sol-placement
    paths:
      - .github/workflows/refactor-phase5-placement-body-final3.yml

permissions:
  contents: write

jobs:
  phase5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/harmonisation-sol-placement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply validated common PlacementBody refactor
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/refactor-phase5-placement-body.yml').read_text()
          start = workflow.index('      - name: Apply common PlacementBody refactor')
          end = workflow.index('      - name: Validate phase 5', start)
          section = workflow[start:end]
          script = section.split('        run: |\n', 1)[1]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())

          replacements = {
              'geometry_anchor = dedent(': 'geometry_anchor = (',
              'geometry_replacement = geometry_anchor + dedent(': 'geometry_replacement = geometry_anchor + (',
              'settled_anchor = dedent(': 'settled_anchor = (',
              'settled_replacement = settled_anchor + dedent(': 'settled_replacement = settled_anchor + (',
              "onSleep={state === 'settling' ? reportSettled : undefined}": "{...(state === 'settling' ? { onSleep: reportSettled } : {})}",
          }
          for old, new in replacements.items():
              if old not in script:
                  raise SystemExit(f'phase5 script patch anchor missing: {old}')
              script = script.replace(old, new, 1)

          old_statement = "text = replace_once(text, old_render, new_render, 'rock body render')"
          replacement_statement = '''render_replacement = """            {rockColliderObject && rockGeometry ? (\n              <PlacementBody\n                bodyKey=\"rock\"\n                state={globalSettling ? 'settling' : placementRockTarget ? 'editing' : 'fixed'}\n                transform={{\n                  position: [...rockPose.position],\n                  rotation: [...rockPose.rotation],\n                  scale: 1,\n                }}\n                geometry={rockGeometry}\n                physics={ROCK_PLACEMENT_BODY_PHYSICS}\n                includeInvisible\n                onTransformFrame={handleRockPhysicsTransform}\n                onSettled={handleRockBodySettled}\n              >\n                <primitive object={rockColliderObject} />\n              </PlacementBody>\n            ) : null}"""\ntext, count = re.subn(\n    r"            \\{object && visualGroup && rockGeometry \\? \\(\\n              <RockPhysicsBody.*?\\n            \\) : null\\}",\n    render_replacement,\n    text,\n    count=1,\n    flags=re.S,\n)\nif count != 1:\n    raise SystemExit('rock body render block missing')'''
          if old_statement not in script:
              raise SystemExit('phase5 final render statement missing')
          script = script.replace(old_statement, replacement_statement, 1)

          exec(compile(script, 'phase5-transform.py', 'exec'))
      - name: Validate phase 5
        run: |
          npm run check
          git diff --check
          python - <<'PY'
          from pathlib import Path
          showroom = Path('src/scene/ShowroomScene.tsx').read_text()
          accessory = Path('src/scene/AccessoryModel.tsx').read_text()
          body = Path('src/features/placement/PlacementBody.tsx').read_text()
          state = Path('src/features/placement/placementBodyState.ts').read_text()
          assert '<PlacementBody' in showroom, 'rock is not using PlacementBody'
          assert '<PlacementBody' in accessory, 'accessory is not using PlacementBody'
          assert 'function RockPhysicsBody' not in showroom, 'legacy RockPhysicsBody remains'
          assert 'useAfterPhysicsStep' not in showroom, 'showroom still owns a physics loop'
          assert 'useAfterPhysicsStep' not in accessory, 'accessory still owns a physics loop'
          assert '<RigidBody' not in accessory, 'accessory still owns a RigidBody'
          assert "state={bodyState}" in accessory, 'accessory body state is not generic'
          assert "state={globalSettling ? 'settling' : placementRockTarget ? 'editing' : 'fixed'}" in showroom, 'rock body state is not generic'
          assert "'fixed' | 'editing' | 'settling'" in state, 'PlacementBody state contract is incomplete'
          assert 'onSleep: reportSettled' in body, 'common sleep settlement callback is missing'
          print('[CAILLOU] Phase 5 structural validation PASS')
          PY
      - name: Commit phase 5 product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/placement/PlacementBody.tsx src/features/placement/placementBodyState.ts src/features/placement/placementBodyState.test.ts src/scene/AccessoryModel.tsx src/scene/ShowroomScene.tsx
          git commit -m "refactor(placement): unifier le cycle physique Rapier"
          git push origin HEAD:refactor/harmonisation-sol-placement
