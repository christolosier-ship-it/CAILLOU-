name: Execute refactor phase 2

on:
  push:
    branches:
      - refactor/harmonisation-sol-placement
    paths:
      - .github/workflows/refactor-phase2-run.yml

permissions:
  contents: write

jobs:
  execute-phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/harmonisation-sol-placement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies like canonical CI
        run: npm install --no-audit --no-fund
      - name: Extract and execute the already-reviewed phase 2 patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/refactor-phase2-patch.yml').read_text()
          anchor = '      - name: Implement common placement geometry and full pedestal constraints\n'
          section = source[source.index(anchor) + len(anchor):]
          run_marker = '        run: |\n'
          section = section[section.index(run_marker) + len(run_marker):]
          end_marker = '\n      - name: Validate phase 2\n'
          script = section[:section.index(end_marker)]
          normalized = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in script.splitlines()
          ) + '\n'
          Path('/tmp/phase2.sh').write_text(normalized)
          PY
          bash /tmp/phase2.sh
      - name: Validate phase 2
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit -- --run
          npm run build
          git diff --check
      - name: Commit only product code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "refactor(placement): introduire la géométrie commune du Socle"
          git push origin HEAD:refactor/harmonisation-sol-placement
