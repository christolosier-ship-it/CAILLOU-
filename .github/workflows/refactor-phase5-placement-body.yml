name: Execute refactor phase 5 placement body

on:
  push:
    branches:
      - refactor/harmonisation-sol-placement
    paths:
      - .github/workflows/refactor-phase5-placement-body.yml

permissions:
  contents: write

jobs:
  phase5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/harmonisation-sol-placement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply common PlacementBody refactor
        shell: python
        run: |
          from pathlib import Path
          import re
          from textwrap import dedent

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'{label} anchor missing')
              return text.replace(old, new, 1)

          Path('src/features/placement/placementBodyState.ts').write_text(dedent('''
          export type PlacementBodyState = 'fixed' | 'editing' | 'settling'
          export type PlacementRigidBodyType = 'fixed' | 'kinematicPosition' | 'dynamic'

          export function placementRigidBodyType(state: PlacementBodyState): PlacementRigidBodyType {
            if (state === 'settling') return 'dynamic'
            if (state === 'editing') return 'kinematicPosition'
            return 'fixed'
          }
          ''').lstrip())

          Path('src/features/placement/placementBodyState.test.ts').write_text(dedent('''
          import { describe, expect, it } from 'vitest'

          import { placementRigidBodyType } from './placementBodyState'

          describe('PlacementBody state machine', () => {
            it.each([
              ['fixed', 'fixed'],
              ['editing', 'kinematicPosition'],
              ['settling', 'dynamic'],
            ] as const)('maps %s to the expected Rapier body type', (state, expected) => {
              expect(placementRigidBodyType(state)).toBe(expected)
            })
          })
          ''').lstrip())

          Path('src/features/placement/PlacementBody.tsx').write_text(dedent('''
          import { useThree } from '@react-three/fiber'
          import { RigidBody, useAfterPhysicsStep } from '@react-three/rapier'
          import type { RapierRigidBody } from '@react-three/rapier'
          import { useCallback, useEffect, useRef } from 'react'
          import type { ReactNode } from 'react'

          import { constrainTransformToPedestal } from './placementConstraints'
          import type { PlacementGeometry } from './placementGeometry'
          import type { PlacementTransform } from './placementTypes'
          import { normalizePlacementTransform } from './placementTransform'
          import { placementRigidBodyType } from './placementBodyState'
          import type { PlacementBodyState } from './placementBodyState'

          export type PlacementBodyCollider = 'hull' | 'cuboid' | 'ball'

          export interface PlacementBodyPhysicsConfig {
            collider: PlacementBodyCollider
            mass: number
            friction: number
            restitution: number
            linearDamping: number
            angularDamping: number
            gravityScale: number
            ccd: boolean
            settlingCcd: boolean
            baseSolverIterations: number
            settlingSolverIterations: number
            settleTimeoutMs: number
            settleLinearVelocityY: number
          }

          interface PlacementBodyProps {
            bodyKey: string
            state: PlacementBodyState
            transform: PlacementTransform
            geometry: PlacementGeometry
            physics: PlacementBodyPhysicsConfig
            includeInvisible?: boolean
            onTransformFrame?: (transform: PlacementTransform) => void
            onSettled?: (transform: PlacementTransform) => void
            children: ReactNode
          }

          function samePosition(left: readonly number[], right: readonly number[], epsilon = 0.000001) {
            return left.length === right.length
              && left.every((value, index) => Math.abs(value - (right[index] ?? value)) <= epsilon)
          }

          function bodyTransform(body: RapierRigidBody, scale: number): PlacementTransform {
            const position = body.translation()
            const rotation = body.rotation()
            return normalizePlacementTransform({
              position: [position.x, position.y, position.z],
              rotation: [rotation.x, rotation.y, rotation.z, rotation.w],
              scale,
            }, { min: scale, max: scale })
          }

          export function PlacementBody({
            bodyKey,
            state,
            transform,
            geometry,
            physics,
            includeInvisible = false,
            onTransformFrame,
            onSettled,
            children,
          }: PlacementBodyProps) {
            const bodyRef = useRef<RapierRigidBody>(null)
            const transformRef = useRef(transform)
            const reportedRef = useRef(false)
            const frameCallbackRef = useRef(onTransformFrame)
            const settledCallbackRef = useRef(onSettled)
            const invalidate = useThree((current) => current.invalidate)
            const safeTransform = constrainTransformToPedestal(transform, geometry)
            transformRef.current = safeTransform

            useEffect(() => {
              frameCallbackRef.current = onTransformFrame
            }, [onTransformFrame])

            useEffect(() => {
              settledCallbackRef.current = onSettled
            }, [onSettled])

            const enforcePedestal = useCallback(() => {
              const body = bodyRef.current
              if (!body) return null
              const current = bodyTransform(body, transformRef.current.scale)
              const safe = constrainTransformToPedestal(current, geometry)
              if (!samePosition(safe.position, current.position)) {
                const changedX = Math.abs(safe.position[0] - current.position[0]) > 0.000001
                const changedY = Math.abs(safe.position[1] - current.position[1]) > 0.000001
                const changedZ = Math.abs(safe.position[2] - current.position[2]) > 0.000001
                body.setTranslation({ x: safe.position[0], y: safe.position[1], z: safe.position[2] }, true)
                const velocity = body.linvel()
                body.setLinvel({
                  x: changedX ? 0 : velocity.x,
                  y: changedY && velocity.y < 0 ? 0 : velocity.y,
                  z: changedZ ? 0 : velocity.z,
                }, true)
              }
              return safe
            }, [geometry])

            useAfterPhysicsStep(() => {
              if (state !== 'settling') return
              const safe = enforcePedestal()
              if (safe) frameCallbackRef.current?.(safe)
              invalidate()
            })

            useEffect(() => {
              if (state === 'settling') return
              const body = bodyRef.current
              if (!body) return
              const position = {
                x: safeTransform.position[0],
                y: safeTransform.position[1],
                z: safeTransform.position[2],
              }
              const rotation = {
                x: safeTransform.rotation[0],
                y: safeTransform.rotation[1],
                z: safeTransform.rotation[2],
                w: safeTransform.rotation[3],
              }
              if (state === 'editing') {
                body.setNextKinematicTranslation(position)
                body.setNextKinematicRotation(rotation)
              } else {
                body.setTranslation(position, false)
                body.setRotation(rotation, false)
              }
              frameCallbackRef.current?.(safeTransform)
              invalidate()
            }, [invalidate, safeTransform, state])

            const reportSettled = useCallback(() => {
              const body = bodyRef.current
              if (!body || state !== 'settling' || reportedRef.current) return
              reportedRef.current = true
              const safe = enforcePedestal() ?? bodyTransform(body, transformRef.current.scale)
              body.setLinvel({ x: 0, y: 0, z: 0 }, false)
              body.setAngvel({ x: 0, y: 0, z: 0 }, false)
              body.sleep()
              frameCallbackRef.current?.(safe)
              settledCallbackRef.current?.(safe)
              invalidate()
            }, [enforcePedestal, invalidate, state])

            useEffect(() => {
              reportedRef.current = false
              if (state !== 'settling') return
              const body = bodyRef.current
              if (!body) return
              enforcePedestal()
              body.setLinvel({ x: 0, y: physics.settleLinearVelocityY, z: 0 }, true)
              body.setAngvel({ x: 0, y: 0, z: 0 }, true)
              body.wakeUp()
              const timer = window.setTimeout(reportSettled, physics.settleTimeoutMs)
              invalidate()
              return () => window.clearTimeout(timer)
            }, [enforcePedestal, invalidate, physics.settleLinearVelocityY, physics.settleTimeoutMs, reportSettled, state])

            return (
              <RigidBody
                key={`${bodyKey}:${state}:${safeTransform.scale.toFixed(4)}`}
                ref={bodyRef}
                type={placementRigidBodyType(state)}
                colliders={physics.collider}
                includeInvisible={includeInvisible}
                position={safeTransform.position}
                quaternion={safeTransform.rotation}
                scale={safeTransform.scale}
                mass={physics.mass}
                friction={physics.friction}
                restitution={physics.restitution}
                linearDamping={physics.linearDamping}
                angularDamping={physics.angularDamping}
                gravityScale={physics.gravityScale}
                ccd={state === 'settling' ? physics.settlingCcd : physics.ccd}
                canSleep
                additionalSolverIterations={state === 'settling'
                  ? physics.settlingSolverIterations
                  : physics.baseSolverIterations}
                onSleep={state === 'settling' ? reportSettled : undefined}
              >
                {children}
              </RigidBody>
            )
          }
          ''').lstrip())

          Path('src/scene/AccessoryModel.tsx').write_text(dedent('''
          import { useThree } from '@react-three/fiber'
          import { useCallback, useEffect, useMemo, useRef, useState } from 'react'
          import { Box3, Sphere } from 'three'
          import type { Object3D } from 'three'
          import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js'

          import {
            ACCESSORY_SETTLE_TIMEOUT_MS,
            isAccessoryTransformWithinPhysicsBounds,
            parseAccessoryPhysics,
          } from '../features/accessories/accessoryPhysics'
          import type { AccessoryTransform, EquippedAccessoryInstance } from '../features/accessories/accessoryTypes'
          import { PlacementBody } from '../features/placement/PlacementBody'
          import type { PlacementBodyPhysicsConfig } from '../features/placement/PlacementBody'
          import type { PlacementBodyState } from '../features/placement/placementBodyState'
          import { constrainTransformToPedestal } from '../features/placement/placementConstraints'
          import { createPlacementGeometry } from '../features/placement/placementGeometry'
          import type { PlacementGeometry } from '../features/placement/placementGeometry'
          import type { PlacementTransform } from '../features/placement/placementTypes'
          import {
            ROCK_SETTLE_TIMEOUT_MS,
            accessoryLocalToWorld,
            accessoryWorldToLocal,
          } from '../features/rockMovement/rockMovementRules'
          import type { RockPose, WorldAccessoryTransform } from '../features/rockMovement/rockMovementTypes'
          import { disposeRockObject } from './rockResources'
          import type { DisposalReport } from './rockResources'

          interface AccessoryModelProps {
            instance: EquippedAccessoryInstance
            selected: boolean
            rockPose: RockPose
            compositionFrozen?: boolean
            globalSettling?: boolean
            onTransformCommit: (instanceId: string, transform: AccessoryTransform) => void
            onGlobalSettled?: (transform: WorldAccessoryTransform) => void
            placementTransform?: PlacementTransform | null
            onPlacementGeometryReady?: (instanceId: string, geometry: PlacementGeometry | null) => void
            onLoadStateChange?: ((instanceId: string, state: 'loading' | 'ready' | 'error', message?: string) => void) | undefined
            onDisposed?: ((instanceId: string, report: DisposalReport) => void) | undefined
          }

          function transformKey(instance: EquippedAccessoryInstance) {
            return [
              ...instance.localPosition,
              ...instance.localRotation,
              instance.uniformScale,
            ].map((value) => Number(value).toFixed(5)).join('|')
          }

          export function AccessoryModel({
            instance,
            selected,
            rockPose,
            compositionFrozen = false,
            globalSettling = false,
            onTransformCommit,
            onGlobalSettled,
            placementTransform = null,
            onPlacementGeometryReady,
            onLoadStateChange,
            onDisposed,
          }: AccessoryModelProps) {
            const [object, setObject] = useState<Object3D | null>(null)
            const [selectionRadius, setSelectionRadius] = useState(0.5)
            const [placementGeometry, setPlacementGeometry] = useState<PlacementGeometry | null>(null)
            const [simulating, setSimulating] = useState(false)
            const handledUnsettledTransformRef = useRef<string | null>(null)
            const disposedCallbackRef = useRef(onDisposed)
            const loadCallbackRef = useRef(onLoadStateChange)
            const invalidate = useThree((state) => state.invalidate)
            const physics = useMemo(() => parseAccessoryPhysics(instance.physics, instance.category), [instance.category, instance.physics])

            useEffect(() => {
              disposedCallbackRef.current = onDisposed
            }, [onDisposed])

            useEffect(() => {
              loadCallbackRef.current = onLoadStateChange
            }, [onLoadStateChange])

            useEffect(() => {
              const controller = new AbortController()
              const loader = new GLTFLoader()
              let active = true
              let loadedObject: Object3D | null = null

              loadCallbackRef.current?.(instance.id, 'loading')
              setPlacementGeometry(null)
              onPlacementGeometryReady?.(instance.id, null)

              async function load() {
                try {
                  const response = await fetch(instance.modelPath, { signal: controller.signal })
                  if (!response.ok) throw new Error(`HTTP ${response.status}`)
                  const buffer = await response.arrayBuffer()
                  if (!active || controller.signal.aborted) return

                  const assetUrl = new URL(instance.modelPath, window.location.href)
                  const resourcePath = assetUrl.href.slice(0, assetUrl.href.lastIndexOf('/') + 1)
                  const gltf = await loader.parseAsync(buffer, resourcePath)
                  loadedObject = gltf.scene
                  const nextPlacementGeometry = createPlacementGeometry(loadedObject)
                  const box = new Box3().setFromObject(loadedObject)
                  if (!box.isEmpty()) {
                    const sphere = box.getBoundingSphere(new Sphere())
                    setSelectionRadius(Math.max(0.08, sphere.radius))
                  }

                  if (!active || controller.signal.aborted) {
                    const report = disposeRockObject(loadedObject)
                    disposedCallbackRef.current?.(instance.id, report)
                    loadedObject = null
                    return
                  }

                  setObject(loadedObject)
                  setPlacementGeometry(nextPlacementGeometry)
                  onPlacementGeometryReady?.(instance.id, nextPlacementGeometry)
                  loadCallbackRef.current?.(instance.id, 'ready')
                  invalidate()
                } catch (error) {
                  if (!active || controller.signal.aborted) return
                  const message = error instanceof Error ? error.message : 'Erreur de chargement inconnue.'
                  loadCallbackRef.current?.(instance.id, 'error', message)
                }
              }

              void load()

              return () => {
                active = false
                controller.abort()
                onPlacementGeometryReady?.(instance.id, null)
                if (loadedObject) {
                  const report = disposeRockObject(loadedObject)
                  disposedCallbackRef.current?.(instance.id, report)
                }
              }
            }, [instance.id, instance.modelPath, invalidate, onPlacementGeometryReady])

            const worldFromInstance = useCallback((): WorldAccessoryTransform => {
              if (placementTransform) {
                return {
                  instanceId: instance.id,
                  worldPosition: [...placementTransform.position],
                  worldRotation: [...placementTransform.rotation],
                  uniformScale: placementTransform.scale,
                }
              }
              return accessoryLocalToWorld(instance.id, instance, rockPose)
            }, [instance, placementTransform, rockPose])

            const renderScale = placementTransform?.scale ?? instance.uniformScale
            const world = worldFromInstance()
            const bodyTransform: PlacementTransform = {
              position: [...world.worldPosition],
              rotation: [...world.worldRotation],
              scale: renderScale,
            }
            const bodyState: PlacementBodyState = globalSettling
              ? 'settling'
              : simulating && physics.dynamic
                ? 'settling'
                : compositionFrozen
                  ? 'editing'
                  : 'fixed'
            const bodyPhysics = useMemo<PlacementBodyPhysicsConfig>(() => ({
              collider: physics.enabled ? physics.collider : 'hull',
              mass: physics.mass,
              friction: physics.friction,
              restitution: physics.restitution,
              linearDamping: physics.linearDamping,
              angularDamping: physics.angularDamping,
              gravityScale: globalSettling ? 1 : physics.gravityScale,
              ccd: physics.ccd,
              settlingCcd: globalSettling || physics.ccd,
              baseSolverIterations: physics.dynamic ? 2 : 0,
              settlingSolverIterations: 2,
              settleTimeoutMs: globalSettling ? ROCK_SETTLE_TIMEOUT_MS : ACCESSORY_SETTLE_TIMEOUT_MS,
              settleLinearVelocityY: -0.02,
            }), [globalSettling, physics])

            useEffect(() => {
              if (!object || !placementGeometry || instance.stabilizedAt !== null || compositionFrozen || globalSettling) return
              const nextKey = transformKey(instance)
              if (handledUnsettledTransformRef.current === nextKey) return
              handledUnsettledTransformRef.current = nextKey

              if (physics.enabled && physics.dynamic) {
                setSimulating(true)
                return
              }

              const canonicalWorld = worldFromInstance()
              const safe = constrainTransformToPedestal({
                position: [...canonicalWorld.worldPosition],
                rotation: [...canonicalWorld.worldRotation],
                scale: instance.uniformScale,
              }, placementGeometry)
              const local = accessoryWorldToLocal({
                instanceId: instance.id,
                worldPosition: [...safe.position],
                worldRotation: [...safe.rotation],
                uniformScale: safe.scale,
              }, rockPose)
              onTransformCommit(instance.id, { ...local, physicsSettled: true })
            }, [
              compositionFrozen,
              globalSettling,
              instance,
              object,
              onTransformCommit,
              physics.dynamic,
              physics.enabled,
              placementGeometry,
              rockPose,
              worldFromInstance,
            ])

            useEffect(() => {
              if (instance.stabilizedAt == null || !simulating || globalSettling) return
              handledUnsettledTransformRef.current = null
              setSimulating(false)
              invalidate()
            }, [globalSettling, instance.stabilizedAt, invalidate, simulating])

            useEffect(() => {
              if (!globalSettling) return
              setSimulating(false)
            }, [globalSettling])

            const handleBodySettled = useCallback((transform: PlacementTransform) => {
              const settledWorld: WorldAccessoryTransform = {
                instanceId: instance.id,
                worldPosition: [...transform.position],
                worldRotation: [...transform.rotation],
                uniformScale: transform.scale,
              }
              if (globalSettling) {
                onGlobalSettled?.(settledWorld)
                return
              }
              if (!simulating) return

              const local = accessoryWorldToLocal(settledWorld, rockPose)
              if (isAccessoryTransformWithinPhysicsBounds(local.localPosition)) {
                handledUnsettledTransformRef.current = transformKey({ ...instance, ...local })
                onTransformCommit(instance.id, { ...local, physicsSettled: true })
              }
              setSimulating(false)
              invalidate()
            }, [globalSettling, instance, invalidate, onGlobalSettled, onTransformCommit, rockPose, simulating])

            if (!object || !placementGeometry) return null

            return (
              <PlacementBody
                bodyKey={`accessory:${instance.id}`}
                state={bodyState}
                transform={bodyTransform}
                geometry={placementGeometry}
                physics={bodyPhysics}
                onSettled={handleBodySettled}
              >
                <primitive object={object} />
                {selected ? (
                  <mesh scale={selectionRadius * 1.08} raycast={() => undefined} renderOrder={20}>
                    <sphereGeometry args={[1, 20, 14]} />
                    <meshBasicMaterial wireframe transparent opacity={0.2} depthTest={false} />
                  </mesh>
                ) : null}
              </PlacementBody>
            )
          }
          ''').lstrip())

          showroom = Path('src/scene/ShowroomScene.tsx')
          text = showroom.read_text()
          text = replace_once(
              text,
              "import { CuboidCollider, Physics, RigidBody, useAfterPhysicsStep } from '@react-three/rapier'\nimport type { RapierRigidBody } from '@react-three/rapier'\n",
              "import { CuboidCollider, Physics, RigidBody } from '@react-three/rapier'\n",
              'rapier imports',
          )
          text = replace_once(
              text,
              "import { constrainPlacementPosition, constrainTransformToPedestal } from '../features/placement/placementConstraints'\n",
              "import { PlacementBody } from '../features/placement/PlacementBody'\nimport type { PlacementBodyPhysicsConfig } from '../features/placement/PlacementBody'\nimport { constrainPlacementPosition, constrainTransformToPedestal } from '../features/placement/placementConstraints'\n",
              'PlacementBody import',
          )
          text, count = re.subn(
              r'\nfunction RockPhysicsBody\(\{.*?\n\}\n\nfunction PedestalGround\(\)',
              dedent('''

              const ROCK_PLACEMENT_BODY_PHYSICS: PlacementBodyPhysicsConfig = {
                collider: 'hull',
                mass: 6,
                friction: 0.9,
                restitution: 0.015,
                linearDamping: 1.8,
                angularDamping: 2.2,
                gravityScale: 1,
                ccd: false,
                settlingCcd: true,
                baseSolverIterations: 1,
                settlingSolverIterations: 6,
                settleTimeoutMs: ROCK_SETTLE_TIMEOUT_MS,
                settleLinearVelocityY: -0.03,
              }

              function PedestalGround()'''),
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('RockPhysicsBody block missing')

          geometry_anchor = dedent('''
            const handleAccessoryGeometryReady = useCallback((instanceId: string, geometry: PlacementGeometry | null) => {
              setAccessoryGeometries((current) => {
                const next = new Map(current)
                if (geometry) next.set(instanceId, geometry)
                else next.delete(instanceId)
                return next
              })
            }, [])
          ''').lstrip('\n')
          geometry_replacement = geometry_anchor + dedent('''
            const rockColliderObject = useMemo(() => {
              if (!object) return null
              const clone = object.clone(true)
              clone.name = 'CAILLOU_DYNAMIC_HULL_COLLIDER'
              clone.visible = false
              return clone
            }, [object])
            const handleRockPhysicsTransform = useCallback((transform: PlacementTransform) => {
              if (!visualGroup) return
              visualGroup.position.set(...transform.position)
              visualGroup.quaternion.set(...transform.rotation).normalize()
              visualGroup.updateMatrixWorld(true)
            }, [visualGroup])
          ''')
          text = replace_once(text, geometry_anchor, geometry_replacement, 'rock collider adapter')

          settled_anchor = dedent('''
            const handleRockSettled = useCallback((pose: RockPose) => {
              finalRockRef.current = pose
              tryReportComposition()
            }, [tryReportComposition])
          ''').lstrip('\n')
          settled_replacement = settled_anchor + dedent('''
            const handleRockBodySettled = useCallback((transform: PlacementTransform) => {
              handleRockSettled(normalizeRockPose({
                position: [...transform.position],
                rotation: [...transform.rotation],
              }))
            }, [handleRockSettled])
          ''')
          text = replace_once(text, settled_anchor, settled_replacement, 'rock settled adapter')

          old_render = dedent('''
                        {object && visualGroup && rockGeometry ? (
                          <RockPhysicsBody
                            object={object}
                            pose={rockPose}
                            bounds={rockGeometry}
                            visualGroup={visualGroup}
                            manipulating={placementRockTarget}
                            globalSettling={globalSettling}
                            onSettled={handleRockSettled}
                          />
                        ) : null}
          ''').lstrip('\n')
          new_render = dedent('''
                        {rockColliderObject && rockGeometry ? (
                          <PlacementBody
                            bodyKey="rock"
                            state={globalSettling ? 'settling' : placementRockTarget ? 'editing' : 'fixed'}
                            transform={{
                              position: [...rockPose.position],
                              rotation: [...rockPose.rotation],
                              scale: 1,
                            }}
                            geometry={rockGeometry}
                            physics={ROCK_PLACEMENT_BODY_PHYSICS}
                            includeInvisible
                            onTransformFrame={handleRockPhysicsTransform}
                            onSettled={handleRockBodySettled}
                          >
                            <primitive object={rockColliderObject} />
                          </PlacementBody>
                        ) : null}
          ''').lstrip('\n')
          text = replace_once(text, old_render, new_render, 'rock body render')
          showroom.write_text(text)
      - name: Validate phase 5
        run: |
          npm run check
          git diff --check
          test "$(grep -R "<PlacementBody" -n src/scene/ShowroomScene.tsx src/scene/AccessoryModel.tsx | wc -l)" -eq 2
          ! grep -n "function RockPhysicsBody" src/scene/ShowroomScene.tsx
          ! grep -n "useAfterPhysicsStep" src/scene/ShowroomScene.tsx src/scene/AccessoryModel.tsx
          ! grep -n "<RigidBody" src/scene/AccessoryModel.tsx
          grep -n "state={bodyState}" src/scene/AccessoryModel.tsx
          grep -n "state={globalSettling ? 'settling'" src/scene/ShowroomScene.tsx
      - name: Commit phase 5 product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/placement/PlacementBody.tsx src/features/placement/placementBodyState.ts src/features/placement/placementBodyState.test.ts src/scene/AccessoryModel.tsx src/scene/ShowroomScene.tsx
          git commit -m "refactor(placement): unifier le cycle physique Rapier"
          git push origin HEAD:refactor/harmonisation-sol-placement