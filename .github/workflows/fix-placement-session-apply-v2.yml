name: Apply placement session fix v2

on:
  push:
    branches:
      - fix/placement-session-independent-drafts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/placement-session-independent-drafts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Reuse corrected integration script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/fix-placement-session-apply.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          script = script.replace("replacement = r'''", "replacement = '''", 1)
          exec(compile(script, '<placement-session-fix>', 'exec'))
          PY
      - name: Validate
        run: npm run check
      - name: Guard session invariants
        shell: bash
        run: |
          grep -q "placementSession?.accessories\[instance.id\]" src/scene/ShowroomScene.tsx
          grep -q "onAccessoryPlacementDraft={handleAccessoryPlacementDraft}" src/features/pedestal/Pedestal.tsx
          grep -q "buildPlacementSettlementPlan" src/features/pedestal/Pedestal.tsx
          ! grep -q "activePlacementDraft" src/scene/ShowroomScene.tsx
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          if git diff --cached --quiet; then
            echo "No product changes"
            exit 0
          fi
          git commit -m "fix(placement): conserver une composition monde par session"
          git push origin HEAD:fix/placement-session-independent-drafts
