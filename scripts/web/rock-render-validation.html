<!doctype html>
<html lang="en" data-status="loading">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CAILLOU render validation</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e5e1d8;font-family:system-ui,sans-serif}
    canvas{display:block;width:100%;height:100%}
    #status{position:fixed;left:12px;bottom:12px;max-width:calc(100% - 24px);padding:6px 10px;border-radius:999px;background:#f2efe9;color:#181817;font:600 12px/1.2 system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  </style>
  <script type="importmap">
    {"imports":{"three":"/node_modules/three/build/three.module.js"}}
  </script>
</head>
<body>
  <div id="status">loading</div>
  <script type="module">
    import * as THREE from 'three'
    import { GLTFLoader } from '/node_modules/three/examples/jsm/loaders/GLTFLoader.js'

    const status = document.querySelector('#status')

    function fail(error) {
      const message = error instanceof Error ? `${error.name}: ${error.message}` : String(error)
      status.textContent = `FAIL ${message}`
      document.documentElement.dataset.status = 'fail'
      document.documentElement.dataset.error = message.slice(0, 500)
      document.title = 'FAIL'
      console.error(error)
    }

    addEventListener('error', (event) => fail(event.error ?? event.message))
    addEventListener('unhandledrejection', (event) => fail(event.reason))

    const params = new URLSearchParams(location.search)
    const model = params.get('model')

    let renderer = null
    if (!model) {
      fail(new Error('Missing ?model= path'))
    } else {
      try {
        renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' })
        renderer.setPixelRatio(1)
        renderer.setSize(innerWidth, innerHeight)
        renderer.outputColorSpace = THREE.SRGBColorSpace
        renderer.toneMapping = THREE.ACESFilmicToneMapping
        renderer.toneMappingExposure = 1
        renderer.shadowMap.enabled = true
        renderer.shadowMap.type = THREE.PCFSoftShadowMap
        document.body.prepend(renderer.domElement)
      } catch (error) {
        fail(error)
      }
    }

    const scene = new THREE.Scene()
    scene.background = new THREE.Color('#e5e1d8')
    const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.05, 100)

    scene.add(new THREE.HemisphereLight(0xf6f1e8, 0x4c4944, 1.2))
    const key = new THREE.DirectionalLight(0xffffff, 2.4)
    key.position.set(4, 5, 5)
    key.castShadow = true
    scene.add(key)
    const fill = new THREE.DirectionalLight(0xc9d4df, 0.75)
    fill.position.set(-4, 2, -3)
    scene.add(fill)
    const rim = new THREE.DirectionalLight(0xffedcf, 0.65)
    rim.position.set(1, 3, -4)
    scene.add(rim)

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(5, 96),
      new THREE.MeshStandardMaterial({ color: 0xd8d2c8, roughness: 1 })
    )
    ground.rotation.x = -Math.PI / 2
    ground.position.y = -0.015
    ground.receiveShadow = true
    scene.add(ground)

    function fit(object) {
      const box = new THREE.Box3().setFromObject(object)
      const size = box.getSize(new THREE.Vector3())
      const center = box.getCenter(new THREE.Vector3())
      object.position.x -= center.x
      object.position.z -= center.z
      object.position.y -= box.min.y
      const radius = Math.max(size.x, size.y, size.z) * 0.5
      const distance = radius / Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * 1.35
      camera.position.set(distance * 0.68, distance * 0.48, distance)
      camera.lookAt(0, size.y * 0.42, 0)
      camera.near = Math.max(0.01, distance / 100)
      camera.far = distance * 20
      camera.updateProjectionMatrix()
    }

    if (renderer && model) {
      try {
        const loader = new GLTFLoader()
        const gltf = await loader.loadAsync(model)
        const root = gltf.scene
        let meshCount = 0
        let texturedMaterialCount = 0

        root.traverse((child) => {
          if (!child.isMesh) return
          meshCount += 1
          child.castShadow = true
          child.receiveShadow = true
          const materials = Array.isArray(child.material) ? child.material : [child.material]
          for (const material of materials) {
            if (material?.map && material?.normalMap && material?.roughness >= 0.65) texturedMaterialCount += 1
          }
        })

        if (meshCount !== 1 || texturedMaterialCount < 1) {
          throw new Error(`Unexpected render payload meshes=${meshCount}, texturedMaterials=${texturedMaterialCount}`)
        }

        scene.add(root)
        fit(root)
        renderer.render(scene, camera)
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)))
        renderer.render(scene, camera)

        status.textContent = `PASS ${model}`
        document.documentElement.dataset.status = 'pass'
        document.title = `PASS ${model}`
      } catch (error) {
        fail(error)
      }
    }

    addEventListener('resize', () => {
      if (!renderer) return
      camera.aspect = innerWidth / innerHeight
      camera.updateProjectionMatrix()
      renderer.setSize(innerWidth, innerHeight)
      renderer.render(scene, camera)
    })
  </script>
</body>
</html>
