<!doctype html>
<html lang="fr" data-status="loading">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CAILLOU accessory resource validation</title>
  <style>
    html,body { margin:0; width:100%; height:100%; background:#e5e1d8; font-family:system-ui,sans-serif; }
    body { display:grid; place-items:center; }
    canvas { width:720px; max-width:100%; aspect-ratio:1; }
    #status { position:fixed; left:16px; bottom:16px; padding:8px 12px; border-radius:999px; background:#f2efe9; font-size:12px; }
  </style>
</head>
<body>
  <canvas id="canvas" width="720" height="720"></canvas>
  <div id="status">Initialisation…</div>
  <script type="module">
    import * as THREE from 'three'
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js'
    import {
      MAX_ACCESSORY_COLLIDER_PARTS,
      MAX_ACCESSORY_COLLIDER_VERTICES_PER_PART,
      createConvexColliderParts,
    } from '/src/features/placement/placementColliderGeometry.ts'
    import { disposeRockObject } from '/src/scene/rockResources.ts'

    const ids = [
      'mask-scan',
      'mouse-ears',
      'traffic-cone',
      'bebe-assets',
      'chicken',
      'crocodile-dog-toy',
      'garden-gnome',
      'model',
      'poo-scan',
      'skull',
      'worn-flip-flop',
    ]
    const rounds = 2
    const html = document.documentElement
    const status = document.querySelector('#status')
    const canvas = document.querySelector('#canvas')
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' })
    renderer.setPixelRatio(1)
    renderer.setSize(720, 720, false)

    const scene = new THREE.Scene()
    scene.background = new THREE.Color('#e5e1d8')
    const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 100)
    scene.add(new THREE.AmbientLight(0xffffff, 0.7))
    const key = new THREE.DirectionalLight(0xffffff, 2.2)
    key.position.set(4.5, 5.5, 4.2)
    scene.add(key)
    const fill = new THREE.DirectionalLight(0xffffff, 0.7)
    fill.position.set(-4.2, 2.4, -2.5)
    scene.add(fill)

    const loader = new GLTFLoader()
    const samples = []

    function nextFrame() {
      return new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)))
    }

    async function loadObject(path) {
      const response = await fetch(path)
      if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`)
      const buffer = await response.arrayBuffer()
      const absolute = new URL(path, location.href)
      const resourcePath = absolute.href.slice(0, absolute.href.lastIndexOf('/') + 1)
      const gltf = await loader.parseAsync(buffer, resourcePath)
      return gltf.scene
    }

    function fitCamera(object) {
      const box = new THREE.Box3().setFromObject(object)
      const sphere = box.getBoundingSphere(new THREE.Sphere())
      const fov = THREE.MathUtils.degToRad(camera.fov)
      const distance = (Math.max(0.08, sphere.radius) / Math.sin(fov / 2)) * 1.2
      const direction = new THREE.Vector3(0.62, 0.42, 0.78).normalize()
      camera.position.copy(sphere.center).addScaledVector(direction, distance)
      camera.near = Math.max(0.01, distance / 100)
      camera.far = Math.max(100, distance * 20)
      camera.lookAt(sphere.center)
      camera.updateProjectionMatrix()
    }

    function runtimeProxyComplexity(parts) {
      return {
        parts: parts.length,
        maxVertices: Math.max(...parts.map((vertices) => vertices.length / 3)),
      }
    }

    renderer.render(scene, camera)
    await nextFrame()
    const baseline = { ...renderer.info.memory }

    async function validateAccessory(id, round) {
      status.textContent = `Tour ${round + 1}/${rounds} · ${id}`
      const modelPath = `/assets/accessories/${id}/model.glb`
      const colliderPath = `/assets/accessories/${id}/collider.glb`

      const model = await loadObject(modelPath)
      scene.add(model)
      fitCamera(model)
      renderer.render(scene, camera)
      await nextFrame()
      const active = { ...renderer.info.memory }

      const modelDisposal = disposeRockObject(model)
      scene.remove(model)
      renderer.render(scene, camera)
      await nextFrame()
      renderer.render(scene, camera)
      const afterModel = { ...renderer.info.memory }

      const collider = await loadObject(colliderPath)
      let colliderParts
      let colliderDisposal
      try {
        colliderParts = createConvexColliderParts(collider)
      } finally {
        colliderDisposal = disposeRockObject(collider)
      }
      const complexity = runtimeProxyComplexity(colliderParts)

      samples.push({
        id,
        round,
        active,
        afterModel,
        modelDisposal,
        colliderDisposal,
        complexity,
      })
    }

    try {
      for (let round = 0; round < rounds; round += 1) {
        for (const id of ids) await validateAccessory(id, round)
      }

      renderer.render(scene, camera)
      await nextFrame()
      const finalMemory = { ...renderer.info.memory }
      const maxResidualGeometries = Math.max(...samples.map((sample) => sample.afterModel.geometries))
      const maxResidualTextures = Math.max(...samples.map((sample) => sample.afterModel.textures))
      const allModelsDisposed = samples.every((sample) => sample.modelDisposal.geometries >= 1 && sample.modelDisposal.materials >= 1)
      const allCollidersDisposed = samples.every((sample) => sample.colliderDisposal.geometries >= 1 && sample.colliderDisposal.materials >= 1)
      const colliderBoundsValid = samples.every((sample) => sample.complexity.parts >= 1
        && sample.complexity.parts <= MAX_ACCESSORY_COLLIDER_PARTS
        && sample.complexity.maxVertices <= MAX_ACCESSORY_COLLIDER_VERTICES_PER_PART)
      const stable = maxResidualGeometries <= baseline.geometries + 1
        && maxResidualTextures <= baseline.textures + 1
        && finalMemory.geometries <= baseline.geometries + 1
        && finalMemory.textures <= baseline.textures + 1

      window.__ACCESSORY_RESOURCE_REPORT__ = {
        status: stable && allModelsDisposed && allCollidersDisposed && colliderBoundsValid ? 'pass' : 'fail',
        rounds,
        accessoriesPerRound: ids.length,
        baseline,
        finalMemory,
        maxResidualGeometries,
        maxResidualTextures,
        allModelsDisposed,
        allCollidersDisposed,
        colliderBoundsValid,
        samples,
      }

      if (window.__ACCESSORY_RESOURCE_REPORT__.status !== 'pass') {
        throw new Error(`Accessory resource residuals not stable: ${JSON.stringify(window.__ACCESSORY_RESOURCE_REPORT__)}`)
      }

      html.dataset.status = 'pass'
      status.textContent = `PASS · ${rounds * ids.length} cycles render/proxy · mémoire résiduelle ${finalMemory.geometries} géométrie(s), ${finalMemory.textures} texture(s)`
    } catch (error) {
      html.dataset.status = 'fail'
      html.dataset.error = error instanceof Error ? error.message : String(error)
      status.textContent = 'FAIL'
      console.error(error)
    }
  </script>
</body>
</html>
